<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>MomenCrafts — Idea Studio · Riyadh, KSA</title>
  <meta name="description" content="MomenCrafts — Founder-led AI idea studio. Private investor room."/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <script>
    // admin.momencrafts.com is installable as "MomenCrafts HQ" (Android TWA + Add to Home Screen);
    // the public site keeps no manifest. Decided in docs/plan/2026-09-23-momencrafts-hq.md, Phase E.
    if (location.hostname === 'admin.momencrafts.com') {
      document.title = 'MomenCrafts HQ';
      var m = document.createElement('link'); m.rel = 'manifest'; m.href = '/hq.webmanifest'; document.head.appendChild(m);
      var t = document.createElement('meta'); t.name = 'theme-color'; t.content = '#0f0e0c'; document.head.appendChild(t);
      var a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = '/hq-icon-192.png'; document.head.appendChild(a);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=JetBrains+Mono:wght@400;500;700&family=Cairo:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"/>
</head>

</body>
</html>
