<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>XHB Founders' HQ · MomenCrafts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --plum:#3D2952; --night:#241933; --lavender:#9B85B0;
    --gold:#B8863A; --gold-soft:#D4A855; --cream:#F7F3ED;
    --cream-dim:#CFC6BC; --line:rgba(247,243,237,.12);
    --card:#2E2042; --card-deep:#281C39; --ok:#7FB069; --warn:#C9743A; --blue:#6E8FBF;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1200px 800px at 85% -10%, #4A3263 0%, var(--night) 55%) fixed, var(--night);
    color:var(--cream);
    font:15px/1.55 "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  h1,h2,h3,.serif{font-family:Georgia, "Times New Roman", serif; letter-spacing:.2px;}
  button{font:inherit; cursor:pointer; border:none; border-radius:9px;}
  input,textarea,select{font:inherit; color:var(--cream); background:var(--night); border:1px solid var(--line); border-radius:9px; padding:9px 11px; width:100%;}
  input:focus,textarea:focus,select:focus{outline:1.5px solid var(--gold); border-color:transparent;}
  textarea{min-height:88px; resize:vertical;}
  ::placeholder{color:rgba(247,243,237,.35);}
  a{color:var(--gold-soft);}

  .app{display:grid; grid-template-columns:270px 1fr; min-height:100vh;}
  /* ---------- Sidebar ---------- */
  .side{background:linear-gradient(180deg, #1F152D 0%, #241933 100%); border-right:1px solid var(--line); padding:24px 18px; display:flex; flex-direction:column; gap:18px;}
  .brand .mark{font-family:Georgia, serif; font-size:28px; font-weight:700; letter-spacing:4px;}
  .brand .rule{width:44px; height:3px; background:var(--gold); margin:7px 0 7px;}
  .brand .sub{color:var(--lavender); font-size:12px; letter-spacing:.6px;}
  .brand .co{margin-top:4px; font-size:11px; color:var(--cream-dim);}
  .co b{color:var(--gold-soft); font-weight:600;}
  .nav{display:flex; flex-direction:column; gap:5px; flex:1;}
  .nav button{background:transparent; text-align:left; color:var(--cream-dim); border:1px solid transparent; padding:9px 12px; border-radius:10px; font-weight:600; font-size:14px; display:flex; justify-content:space-between; align-items:center;}
  .nav button:hover{color:var(--cream); border-color:var(--line);}
  .nav button.active{background:var(--plum); color:var(--cream); border-color:var(--gold);}
  .nav .cnt{font-size:11px; background:var(--night); border:1px solid var(--line); color:var(--lavender); padding:1px 8px; border-radius:999px;}
  .whoami{border-top:1px solid var(--line); padding-top:12px; font-size:12px; color:var(--cream-dim);}
  .whoami b{color:var(--cream); display:block; font-size:13px;}
  .link{background:none; color:var(--lavender); text-decoration:underline; padding:0; font-size:12px;}

  .btn{padding:10px 14px; font-weight:600;}
  .btn-gold{background:var(--gold); color:#241933;}
  .btn-gold:hover{background:var(--gold-soft);}
  .btn-ghost{background:transparent; color:var(--cream); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--lavender);}
  .btn-sm{padding:7px 11px; font-size:13px; font-weight:600;}

  /* ---------- Main ---------- */
  .main{padding:26px 32px 70px; max-width:1080px; width:100%;}
  .demo-banner{background:linear-gradient(90deg, var(--gold) 0%, var(--gold-soft) 100%); color:#241933; border-radius:10px; padding:10px 16px; font-size:13px; margin-bottom:16px; font-weight:600;}
  .nudge-banner{background:var(--plum); border:1px solid var(--gold); border-radius:12px; padding:13px 16px; margin-bottom:16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .nudge-banner .txt{flex:1; min-width:220px; font-size:13.5px;}
  .nudge-banner .txt b{color:var(--gold-soft);}
  .pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .pagehead h1{font-size:26px;}
  .pagehead .meta{color:var(--lavender); font-size:13px; margin-top:3px;}
  .hint{color:var(--cream-dim); font-size:13px; margin-bottom:16px; max-width:780px;}
  .hint b{color:var(--gold-soft);}

  .chip{font-size:11px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; padding:5px 11px; border-radius:999px; white-space:nowrap; display:inline-block;}
  .chip.sealed{background:#241933; color:var(--lavender); border:1px solid var(--lavender);}
  .chip.revealed{background:var(--gold); color:#241933;}
  .chip.aligned{background:var(--ok); color:#1E2A18;}
  .chip.divergent{background:var(--warn); color:#2A1708;}
  .chip.decided{background:var(--cream); color:var(--plum);}
  .chip.later{background:#241933; color:var(--cream-dim); border:1px solid var(--line);}
  .chip.next{background:var(--lavender); color:#241933;}
  .chip.now{background:var(--gold); color:#241933;}
  .chip.done{background:var(--ok); color:#1E2A18;}
  .chip.source{background:var(--gold); color:#241933;}
  .chip.derived{background:#241933; color:var(--lavender); border:1px solid var(--lavender);}
  .chip.legal{background:var(--cream); color:var(--plum);}
  .chip.other{background:#241933; color:var(--cream-dim); border:1px solid var(--line);}

  /* ---------- Vision ---------- */
  .v-quote{background:var(--plum); border-left:4px solid var(--gold); border-radius:0 var(--radius) var(--radius) 0; padding:20px 24px; font-family:Georgia, serif; font-size:19px; font-style:italic; margin-bottom:18px; line-height:1.6;}
  .v-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:13px; margin:16px 0;}
  .v-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
  .v-card h3{color:var(--gold-soft); font-size:16px; margin-bottom:7px;}
  .v-card p{font-size:13.5px; color:var(--cream-dim);}
  .v-sec{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 22px; margin-bottom:14px;}
  .v-sec h2{font-size:17px; color:var(--gold-soft); margin-bottom:10px;}
  .v-sec p{font-size:14px; margin-bottom:8px;}
  .v-sec ul{margin:4px 0 4px 20px; font-size:13.5px; color:var(--cream-dim);}
  .v-sec li{margin-bottom:5px;}
  .v-foot{font-size:12.5px; color:var(--cream-dim); margin-top:14px;}

  /* ---------- Plan ---------- */
  .phase-block{margin-bottom:20px;}
  .phase-block h2{font-size:15px; color:var(--gold-soft); letter-spacing:.8px; margin-bottom:9px;}
  .plan-item{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:11px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .plan-item .t{flex:1; min-width:220px; font-size:14px;}
  .plan-item .sub{display:block; font-size:12px; color:var(--cream-dim); margin-top:2px;}
  .plan-item .chipbtn{background:none; padding:0;}
  .addbar{background:var(--card); border:1px dashed var(--lavender); border-radius:var(--radius); padding:14px 16px; margin-top:10px; display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:9px; align-items:center;}

  /* ---------- Q&A (sessions) ---------- */
  .sess-chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .sess-chip{background:transparent; border:1px solid var(--line); color:var(--cream); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;}
  .sess-chip.active{background:var(--plum); border-color:var(--gold);}
  .qcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:19px 21px; margin-bottom:16px;}
  .qhead{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
  .qhead h3{font-size:17px; line-height:1.4; max-width:78%;}
  .qctx{color:var(--cream-dim); font-size:13px; margin-top:6px; max-width:80%;}
  .answers{display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-top:15px;}
  .apanel{background:var(--card-deep); border:1px solid var(--line); border-radius:11px; padding:12px 14px; min-height:110px; display:flex; flex-direction:column; gap:8px;}
  .apanel .who{font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--gold-soft);}
  .apanel .who.partner{color:var(--lavender);}
  .apanel .body{white-space:pre-wrap; font-size:14px;}
  .locked{display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; color:var(--cream-dim); gap:6px; text-align:center; font-size:13px;}
  .locked .ic{font-size:20px;}
  .saved-note{font-size:12px; color:var(--ok);}
  .qactions{display:flex; gap:10px; margin-top:13px; flex-wrap:wrap; align-items:center;}
  .qactions .note{font-size:12.5px; color:var(--cream-dim);}
  .resolve{margin-top:15px; border-top:1px dashed var(--line); padding-top:13px; display:grid; gap:10px;}
  .resolve .row{display:grid; grid-template-columns:170px 1fr 180px; gap:10px;}
  .decision-view{margin-top:13px; background:#221732; border-left:3px solid var(--gold); border-radius:0 10px 10px 0; padding:10px 14px; font-size:14px;}
  .decision-view .lbl{font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--gold-soft); font-weight:700;}
  .decision-view .own{color:var(--cream-dim); font-size:12.5px; margin-top:4px;}
  .addq{background:var(--card); border:1px dashed var(--lavender); border-radius:var(--radius); padding:16px 20px; margin-top:6px;}
  .addq h3{font-size:14px; color:var(--lavender); margin-bottom:9px;}
  .addq .grid{display:grid; gap:9px;}

  /* ---------- Decisions / tables ---------- */
  table.log{width:100%; border-collapse:collapse; background:var(--card); border-radius:var(--radius); overflow:hidden;}
  .log th{background:var(--plum); text-align:left; font-size:11.5px; letter-spacing:1.2px; text-transform:uppercase; padding:10px 13px; color:var(--cream);}
  .log td{padding:11px 13px; border-top:1px solid var(--line); font-size:13.5px; vertical-align:top;}
  .log td.q{max-width:320px;}

  /* ---------- Updates ---------- */
  .compose{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px 17px; margin-bottom:18px; display:grid; gap:10px;}
  .post{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px 18px; margin-bottom:12px;}
  .post.pinned{border-color:var(--gold);}
  .post .ph{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--cream-dim); margin-bottom:7px; flex-wrap:wrap;}
  .post .ph b{color:var(--gold-soft);}
  .post .body{white-space:pre-wrap; font-size:14px;}

  /* ---------- Documents ---------- */
  .doc-row{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:13px 16px; margin-bottom:9px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .doc-row .t{flex:1; min-width:230px;}
  .doc-row .t b{font-size:14.5px;}
  .doc-row .st{display:block; font-size:12.5px; color:var(--cream-dim); margin-top:2px;}
  .ack{font-size:12px; color:var(--cream-dim);}
  .ack .yes{color:var(--ok); font-weight:700;}
  .doc-add{background:var(--card); border:1px dashed var(--lavender); border-radius:var(--radius); padding:14px 16px; margin-top:12px; display:grid; grid-template-columns:2fr 1fr 2fr auto; gap:9px;}

  /* ---------- Ask ---------- */
  .ask-box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; display:grid; gap:11px; margin-bottom:16px;}
  .ask-ans{background:var(--card-deep); border-left:3px solid var(--gold); border-radius:0 12px 12px 0; padding:15px 18px; white-space:pre-wrap; font-size:14px;}
  .ask-note{background:var(--plum); border-radius:12px; padding:15px 18px; font-size:13.5px;}
  .ask-note b{color:var(--gold-soft);}

  /* ---------- Podcast ---------- */
  .ep-row{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px 15px; margin-bottom:9px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .ep-row .t{flex:1; min-width:220px;}
  .ep-row .t b{font-size:14.5px;}
  .ep-row .st{display:block; font-size:12.5px; color:var(--cream-dim); margin-top:2px;}
  .ep-add{background:var(--card); border:1px dashed var(--lavender); border-radius:var(--radius); padding:14px 16px; margin-top:12px; display:grid; grid-template-columns:2fr 2fr auto; gap:9px;}
  #player-dock{display:none; position:fixed; left:18px; bottom:18px; z-index:70; background:var(--plum); border:1px solid var(--gold); border-radius:14px; padding:10px 14px; gap:11px; align-items:center; box-shadow:0 10px 34px rgba(0,0,0,.5); max-width:420px;}
  #player-dock .pl-t{font-size:13px; font-weight:600; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #player-dock .pl-ic{font-size:18px;}

  .empty{border:1px dashed var(--line); border-radius:var(--radius); padding:34px; text-align:center; color:var(--cream-dim);}
  .toast{position:fixed; bottom:22px; right:22px; background:var(--cream); color:var(--plum); font-weight:600; padding:11px 17px; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.4); z-index:80; font-size:13.5px;}

  /* ---------- Auth & modal ---------- */
  .center-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px;}
  .authcard{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:40px 42px; max-width:430px; width:100%; text-align:center;}
  .authcard .mark{font-family:Georgia, serif; font-size:38px; letter-spacing:5px; font-weight:700;}
  .authcard .rule{width:52px; height:3px; background:var(--gold); margin:12px auto;}
  .authcard p{color:var(--cream-dim); font-size:13.5px; margin-bottom:18px;}
  .authcard .grid{display:grid; gap:11px; text-align:left;}
  .msg{font-size:13px; color:var(--gold-soft); margin-top:12px; min-height:18px;}
  .overlay{position:fixed; inset:0; background:rgba(20,12,30,.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px;}
  .modal{background:var(--card); border:1px solid var(--lavender); border-radius:16px; padding:25px 27px; width:100%; max-width:500px;}
  .modal h2{font-size:19px; margin-bottom:13px;}
  .modal .grid{display:grid; gap:11px;}
  .modal label{font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--gold-soft); font-weight:700;}
  .modal .foot{display:flex; justify-content:flex-end; gap:10px; margin-top:15px; flex-wrap:wrap;}
  .tpl-desc{font-size:12.5px; color:var(--cream-dim);}

  @media (max-width: 940px){
    .app{grid-template-columns:1fr;}
    .side{border-right:none; border-bottom:1px solid var(--line);}
    .nav{flex-direction:row; flex-wrap:wrap;}
    .answers,.v-grid{grid-template-columns:1fr;}
    .resolve .row,.addbar,.doc-add{grid-template-columns:1fr;}
    .main{padding:18px 15px 70px;}
    .qhead h3,.qctx{max-width:100%;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="player-dock"></div>
<audio id="bg-audio" preload="none"></audio>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   XHB × MomenCrafts — Founders' HQ
   ═══════════════════════════════════════════════════════════════════════════

   SCHEMA BOUNDARY
   ───────────────
   public.*   — MomenCrafts investor portal (investor_tokens, investor_sessions,
                investor_events, access_requests, co_*, etc.).
                RLS: service-role only (edge functions).

   xhb.*     — XHB Founders' HQ (allowed_users, sessions, questions, answers,
                plan_items, updates, documents, nudges, episodes, content,
                question_templates, gate_attempts, gate_log, artifacts,
                artifact_versions, findings, enrolment_tokens, api_keys,
                access_log, decision_revisions).
                Read/write: xhb.is_allowed() — two-person allowlist only.

   AUTH MODEL
   ──────────
   XHB auth = Supabase phone OTP (via xhb-gate-request edge function)
            + xhb.is_allowed() row-level security.
   Never MomenCrafts investor_tokens, access_requests, MCR- tokens, or any
   portal tier. The two systems share a Supabase project but are isolated
   by schema. No portal edge function queries any xhb.* table.

   DASHBOARD ACCESS
   ────────────────
   momen@momencrafts.com — founder, superadmin (access management only;
     never bypasses the seal, never verdicts own artifacts).

   SETUP (live mode)
   ─────────────────
     1. Run the xhb schema migrations in your Supabase SQL editor.
     2. Fill SUPABASE_URL and SUPABASE_ANON_KEY below.
     3. Auth → enable Phone provider (Twilio); add /xhb/ to redirect allowlist.
     4. Optional: deploy the ask-xhb edge function + ANTHROPIC_API_KEY secret.
   Leave CONFIG empty for DEMO MODE (in-memory sample data, zero network calls).
   ═══════════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  SUPABASE_URL: "https://isciigqmdfcozrtojqcm.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzY2lpZ3FtZGZjb3pydG9qcWNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDk4ODYsImV4cCI6MjA5NjU4NTg4Nn0.OUV0dUWUt0UBU9bdJpwWiXI2PgclddNO0t1cA4ZLF_8",
  XHB_GATE_URL: "https://isciigqmdfcozrtojqcm.supabase.co/functions/v1/xhb-gate-request",
};

/* ---- Demo content (offline / no-config mode only — no venture data) ---- */
const DEMO_VISION = {
  line: "Align independently, reveal together, decide once.",
  definition: "This is a demonstration of the Founders' HQ workspace. When connected to a live database, this section displays the venture's vision, product definitions, and strategic non-goals. All content loads from the server after authentication — nothing sensitive is shipped in this file.",
  products: [
    ["Product A 🔧", "Description of the first product or service offering."],
    ["Product B 📊", "Description of the second product or service offering."],
    ["Product C 📱", "Description of the third product or service offering."]
  ],
  nongoals: [
    "Sample non-goal — items deliberately excluded from current scope.",
    "Sample non-goal — boundaries that keep the project focused.",
    "Sample non-goal — things to revisit in a later phase."
  ],
  phases: [
    ["P0", "Foundation — setup, governance, initial structure."],
    ["P1", "Pilot — validation with real data on a small scale."],
    ["P2", "Build — core product development and integration."],
    ["P3", "Scale — expansion, partnerships, operational readiness."]
  ],
  credit: "Demo mode — connect to Supabase to load the live venture record."
};

const DEMO_TEMPLATES = {
  "general": { name: "General Alignment", desc: "A general-purpose alignment session with sample questions.",
    questions: [
      ["Sample question about project scope", "Context: define the boundaries and deliverables of the initiative."],
      ["Sample question about team structure", "Context: clarify roles, responsibilities, and decision rights."],
      ["Sample question about timeline", "Context: agree on key milestones and deadlines."]
    ]},
  "operations": { name: "Operations", desc: "Operational decisions and processes.",
    questions: [
      ["Sample question about workflow", "Context: establish standard operating procedures."],
      ["Sample question about tooling and platforms", "Context: agree on the tools the team will use."]
    ]},
  "custom": { name: "Blank session", desc: "Start empty and add your own questions.", questions: [] }
};

/* ---- Active content (overwritten from Supabase after auth in live mode) ---- */
let VISION = DEMO_VISION;
let TEMPLATES = { ...DEMO_TEMPLATES };

const PHASES = ["P0","P1","P2","P3","P4","P5","General"];
const PLAN_STATUS = ["later","next","now","done"];

/* ------------------------------ State ------------------------------------ */
const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
let sb = null;
let me = null;
let members = [];
let nav = "vision";
let sessions = [], currentSession = null, questions = [];
let planItems = [], updatesFeed = [], docsList = [], nudges = [], episodesList = [];
let currentEp = null;
let confirmReveal = {};
let channel = null;
let askAnswer = "", askBusy = false;
const demoStore = {};

/* ------------------------------ Demo data -------------------------------- */
const DEMO_ME = { email: "founder-a@example.com", name: "Founder A" };
const DEMO_PARTNER = { email: "founder-b@example.com", name: "Founder B" };
const now = () => new Date().toISOString();

function demoSeed() {
  members = [{ email: DEMO_ME.email, display_name: DEMO_ME.name }, { email: DEMO_PARTNER.email, display_name: DEMO_PARTNER.name }];
  const sid = "demo-1";
  const tplKey = Object.keys(TEMPLATES).find(k => k !== "custom") || "custom";
  sessions = [{ id: sid, title: TEMPLATES[tplKey] ? TEMPLATES[tplKey].name : "Alignment", template: tplKey, created_at: now() }];
  const t = (TEMPLATES[tplKey] && TEMPLATES[tplKey].questions) ? TEMPLATES[tplKey].questions : [];
  questions = t.map((q, i) => ({ id: "dq" + i, session_id: sid, position: i, prompt: q[0], context: q[1], status: "sealed", outcome: null, decision: "", decision_owner: "", answers: {} }));
  if (questions.length > 0) {
    questions[0].status = "revealed";
    questions[0].answers[DEMO_ME.email] = { body: "Sample response from Founder A." };
    questions[0].answers[DEMO_PARTNER.email] = { body: "Sample response from Founder B." };
  }
  if (questions.length > 2) {
    questions[2].status = "resolved"; questions[2].outcome = "decided";
    questions[2].decision = "Sample decision recorded during demo — connect to Supabase for live decisions.";
    questions[2].decision_owner = "Both — " + new Date().toLocaleDateString("en-GB");
    questions[2].answers[DEMO_ME.email] = { body: "Sample sealed answer from Founder A." };
    questions[2].answers[DEMO_PARTNER.email] = { body: "Sample sealed answer from Founder B." };
  }
  currentSession = sessions[0];
  demoStore[sid] = questions;

  planItems = [

const norm = (e) => (e || "").trim().toLowerCase();
function nameFor(email) {
  const m = members.find(x => norm(x.email) === norm(email));
  if (m && m.display_name) return m.display_name;
  return (email || "").split("@")[0] || "Partner";
}
function partnerOf(meEmail) {
  const other = members.find(x => norm(x.email) !== norm(meEmail));
  return other ? { email: norm(other.email), name: nameFor(other.email) } : { email: null, name: "Partner" };
}

async function loadMembers() {

  members = data || [];
}
async function loadSessions() {
  if (!LIVE) return;
  const { data } = await sb.from("sessions").select("*").order("created_at", { ascending: false });
  sessions = data || [];
  if (currentSession) currentSession = sessions.find(s => s.id === currentSession.id) || sessions[0] || null;
  else currentSession = sessions[0] || null;
}
async function loadQuestions() {
  if (!LIVE) { questions = currentSession ? (demoStore[currentSession.id] || []) : []; return; }
  if (!currentSession) { questions = []; return; }
  const { data: qs } = await sb.from("questions").select("*").eq("session_id", currentSession.id).order("position").order("created_at");
  const ids = (qs || []).map(q => q.id);
  let ansRows = [];
  if (ids.length) { const { data: ans } = await sb.from("answers").select("*").in("question_id", ids); ansRows = ans || []; }
  questions = (qs || []).map(q => {
    const a = {};
    ansRows.filter(r => r.question_id === q.id).forEach(r => { a[norm(r.author_email)] = { body: r.body, updated_at: r.updated_at }; });
    return { ...q, answers: a };
  });
}
async function loadAllResolved() {
  if (!LIVE) {
    const out = [];
    sessions.forEach(s => (demoStore[s.id] || []).forEach(q => { if (q.status === "resolved") out.push({ ...q, session_title: s.title }); }));
    return out;
  }
  const { data } = await sb.from("questions").select("*, sessions(title)").eq("status", "resolved").order("resolved_at", { ascending: false });
  return (data || []).map(q => ({ ...q, session_title: q.sessions ? q.sessions.title : "" }));
}
async function loadTable(table, order) {
  if (!LIVE) return;
  const { data } = await sb.from(table).select("*").order(order.col, { ascending: order.asc });
  if (table === "plan_items") planItems = data || [];

  if (table === "episodes") episodesList = data || [];
}
async function dbInsert(table, row, demoArr) {
  if (!LIVE) { row.id = "x" + Math.random().toString(36).slice(2, 9); row.created_at = now(); demoArr.unshift(row); render(); return row; }
  const { data, error } = await sb.from(table).insert(row).select().single();
  if (error) { toast("Save failed: " + error.message); return null; }
  await refresh(); return data;
}
async function dbUpdate(table, id, patch, demoArr) {
  if (!LIVE) { const it = demoArr.find(x => x.id === id); if (it) Object.assign(it, patch); render(); return; }
  const { error } = await sb.from(table).update(patch).eq("id", id);
  if (error) toast("Update failed: " + error.message); else await refresh();
}

async function createSession(title, templateKey) {
  const tpl = TEMPLATES[templateKey] || TEMPLATES.custom;
  if (!LIVE) {
    const sid = "demo-" + Math.random().toString(36).slice(2, 8);
    sessions.unshift({ id: sid, title, template: templateKey, created_at: now() });
    demoStore[sid] = tpl.questions.map((q, i) => ({ id: sid + "-q" + i, session_id: sid, position: i, prompt: q[0], context: q[1], status: "sealed", outcome: null, decision: "", decision_owner: "", answers: {} }));
    currentSession = sessions[0]; questions = demoStore[sid]; render(); return;
  }
  const { data, error } = await sb.from("sessions").insert({ title, template: templateKey, created_by: me.email }).select().single();
  if (error) { toast("Could not create session: " + error.message); return; }
  if (tpl.questions.length) {
    const rows = tpl.questions.map((q, i) => ({ session_id: data.id, position: i, prompt: q[0], context: q[1], created_by: me.email }));
    await sb.from("questions").insert(rows);
  }

}
async function addQuestion(prompt, context) {
  if (!LIVE) { questions.push({ id: "dq" + Math.random().toString(36).slice(2, 8), session_id: currentSession.id, position: questions.length, prompt, context, status: "sealed", outcome: null, decision: "", decision_owner: "", answers: {} }); render(); return; }
  const { error } = await sb.from("questions").insert({ session_id: currentSession.id, position: questions.length, prompt, context, created_by: me.email });

}
async function saveAnswer(q, body) {
  if (!body.trim()) { toast("Write an answer first."); return; }
  if (!LIVE) { q.answers[norm(me.email)] = { body, updated_at: now() }; render(); toast("Answer sealed ✓"); return; }
  const { error } = await sb.from("answers").upsert({ question_id: q.id, author_email: norm(me.email), body, updated_at: now() }, { onConflict: "question_id,author_email" });
  if (error) toast("Save failed: " + error.message); else { await refresh(); toast("Answer sealed ✓"); }
}
async function setQuestion(q, patch) {
  if (!LIVE) { Object.assign(q, patch); render(); return; }
  const { error } = await sb.from("questions").update(patch).eq("id", q.id);
  if (error) toast("Update failed: " + error.message); else await refresh();
}
async function refresh() {
  if (!LIVE) { render(); return; }
  await loadSessions(); await loadQuestions();
  await loadTable("plan_items", { col: "position", asc: true });
  await loadTable("updates", { col: "created_at", asc: false });
  await loadTable("documents", { col: "created_at", asc: true });
  await loadTable("nudges", { col: "created_at", asc: false });
  await loadTable("episodes", { col: "created_at", asc: true });

}

function subscribeRealtime() {
  if (!LIVE || channel) return;
  try {
    channel = sb.channel("hq");
    ["sessions", "questions", "answers", "plan_items", "updates", "documents", "nudges", "episodes"].forEach(t => {
      channel.on("postgres_changes", { event: "*", schema: "public", table: t }, () => refresh());
    });
    channel.subscribe();
  } catch (e) { /* optional */ }
}

async function loadTemplateContent() {

      TEMPLATES = {};

function qCard(q) {
  const meKey = norm(me.email);
  const partner = partnerOf(me.email);
  const mine = q.answers[meKey];
  const theirsKey = Object.keys(q.answers).find(k => k !== meKey);
  const theirs = theirsKey ? q.answers[theirsKey] : null;
  const bothIn = !!mine && !!theirs;
  const sealed = q.status === "sealed";
  let mePanel;
  if (sealed) {
    mePanel = '<div class="apanel"><span class="who">You · ' + esc(me.name) + '</span>' +
      '<textarea dir="auto" id="ans-' + q.id + '" placeholder="Write your independent answer…">' + esc(mine ? mine.body : "") + '</textarea>' +
      '<div style="display:flex; gap:8px; align-items:center;"><button class="btn btn-gold btn-sm" data-act="save" data-q="' + q.id + '">' + (mine ? "Update sealed answer" : "Seal my answer") + '</button>' +
      (mine ? '<span class="saved-note">Sealed ✓</span>' : "") + '</div></div>';
  } else {
    mePanel = '<div class="apanel"><span class="who">You · ' + esc(me.name) + '</span><div class="body" dir="auto">' + esc(mine ? mine.body : "— no answer recorded —") + '</div></div>';
  }
  let themPanel;
  if (sealed) {
    themPanel = '<div class="apanel"><span class="who partner">' + esc(partner.name) + '</span><div class="locked"><span class="ic">🔒</span><span>' + (theirs ? esc(partner.name) + " has sealed an answer.<br>Reveal to compare." : "Waiting for " + esc(partner.name) + "'s sealed answer…") + '</span></div></div>';
  } else {
    themPanel = '<div class="apanel"><span class="who partner">' + esc(partner.name) + '</span><div class="body" dir="auto">' + esc(theirs ? theirs.body : "— no answer recorded —") + '</div></div>';
  }
  let actions = "";
  if (sealed) {
    if (bothIn) actions = '<button class="btn btn-gold btn-sm" data-act="reveal" data-q="' + q.id + '">Reveal both answers</button><span class="note">Both answers are in.</span>';
    else if (mine && !theirs) actions = confirmReveal[q.id]
      ? '<button class="btn btn-gold btn-sm" data-act="reveal" data-q="' + q.id + '">Confirm reveal with one answer missing</button><span class="note">This breaks the sealed protocol for this question.</span>'
      : '<button class="btn btn-ghost btn-sm" data-act="force" data-q="' + q.id + '">Force reveal…</button><span class="note">Best practice: wait for both sealed answers.</span>';
    else actions = '<span class="note">Answers stay hidden from each other until both are sealed.</span>';
  } else if (q.status === "revealed") actions = '<span class="note">Discuss, then record the outcome below.</span>';
  else actions = '<button class="btn btn-ghost btn-sm" data-act="reopen" data-q="' + q.id + '">Reopen</button>';
  let resolveBlock = "";
  if (q.status === "revealed") {
    resolveBlock = '<div class="resolve"><div class="row">' +
      '<select id="out-' + q.id + '"><option value="decided">Decided</option><option value="aligned">Aligned as-is</option><option value="divergent">Divergent — park it</option></select>' +
      '<input dir="auto" id="dec-' + q.id + '" placeholder="What did we agree? (one or two sentences)" />' +
      '<input dir="auto" id="own-' + q.id + '" placeholder="Owner / follow-up" /></div>' +
      '<div><button class="btn btn-gold btn-sm" data-act="resolve" data-q="' + q.id + '">Log the outcome</button></div></div>';
  }
  if (q.status === "resolved" && (q.decision || q.outcome)) {
    resolveBlock = '<div class="decision-view"><span class="lbl">' + (q.outcome === "divergent" ? "Parked divergence" : "Decision") + '</span><div dir="auto">' + esc(q.decision || "(recorded without text)") + '</div>' + (q.decision_owner ? '<div class="own">Owner: ' + esc(q.decision_owner) + '</div>' : "") + '</div>';
  }
  return '<div class="qcard"><div class="qhead"><div><h3 dir="auto">' + esc(q.prompt) + '</h3>' + (q.context ? '<div class="qctx" dir="auto">' + esc(q.context) + '</div>' : "") + '</div>' + chipQ(q) + '</div>' +
    '<div class="answers">' + mePanel + themPanel + '</div><div class="qactions">' + actions + '</div>' + resolveBlock + '</div>';
}

    : '<div class="ask-note"><b>Demo mode.</b> Once live and configured, Ask-XHB answers questions from your own venture record — decisions, plan, updates, and any document text you store — with the same rule as XHB itself: if the evidence is not there, it says so instead of guessing.</div>';
  return '<div class="pagehead"><div><h1>Ask XHB</h1><div class="meta">Citation-grounded answers over your own venture record</div></div></div>' +
    '<div class="ask-box"><textarea dir="auto" id="ask-q" placeholder="e.g. What have we decided so far, and what is still open?"></textarea>' +
    '<div><button class="btn btn-gold btn-sm" data-act="ask" ' + (askBusy ? "disabled" : "") + '>' + (askBusy ? "Thinking…" : "Ask") + '</button></div></div>' +
    (askAnswer ? '<div class="ask-ans" dir="auto">' + esc(askAnswer) + '</div>' : note);
}

/* ----- Podcast view & background player ----- */
function viewPodcast() {
  const rows = episodesList.map(ep =>
    '<div class="ep-row"><button class="btn ' + (ep.url ? "btn-gold" : "btn-ghost") + ' btn-sm" data-act="ep-play" data-id="' + ep.id + '">' +
    (currentEp && currentEp.id === ep.id && !audioEl.paused ? "⏸" : "▶") + '</button>' +
    '<div class="t"><b dir="auto">' + esc(ep.title) + '</b>' + (ep.note || !ep.url ? '<span class="st" dir="auto">' + esc(ep.note || "") + (!ep.url ? " (no audio link yet)" : "") + '</span>' : "") + '</div></div>').join("");
  return '<div class="pagehead"><div><h1>Podcast</h1><div class="meta">Episodes keep playing in the background while you work in any tab</div></div></div>' +
    '<div class="hint">Tip: generate audio overviews of the deck and remaster (NotebookLM-style), upload the MP3s to Supabase Storage (public bucket), and paste the links here — instant founder podcast about your own venture.</div>' +
    (rows || '<div class="empty">No episodes yet.</div>') +
    '<div class="ep-add"><input dir="auto" id="ep-title" placeholder="Episode title…" /><input id="ep-url" placeholder="Direct audio URL (.mp3 / .m4a)" /><button class="btn btn-gold btn-sm" data-act="ep-add">Add episode</button></div>';
}
const audioEl = document.getElementById("bg-audio");
function renderPlayer() {
  const dock = document.getElementById("player-dock");
  if (!currentEp) { dock.style.display = "none"; dock.innerHTML = ""; return; }
  dock.style.display = "flex";
  dock.innerHTML = '<span class="pl-ic">🎧</span><div class="pl-t" dir="auto">' + esc(currentEp.title) + '</div>' +
    '<button class="btn btn-gold btn-sm" data-act="pl-toggle">' + (audioEl.paused ? "▶" : "⏸") + '</button>' +
    '<button class="btn btn-ghost btn-sm" data-act="pl-close">✕</button>';
}
["play", "pause", "ended"].forEach(ev => audioEl.addEventListener(ev, () => { renderPlayer(); if (nav === "podcast") render(); }));

/* ----- Shell ----- */
function unseenNudges() { return nudges.filter(n => !n.seen && norm(n.to_email) === norm(me.email)); }
function render() {
  if (LIVE && !me) { renderAuth(); return; }
  const counts = { sessions: sessions.length, decisions: resolvedCache.length, plan: planItems.filter(p => p.status !== "done").length };
  const navBtn = (key, label, cnt) => '<button class="' + (nav === key ? "active" : "") + '" data-act="nav" data-nav="' + key + '">' + label + (cnt ? '<span class="cnt">' + cnt + '</span>' : "") + '</button>';
  const nb = unseenNudges().map(n =>
    '<div class="nudge-banner"><div class="txt"><b>' + esc(nameFor(n.from_email)) + '</b> nudged you: “' + esc(n.message) + '”</div>' +
    '<button class="btn btn-gold btn-sm" data-act="nudge-open" data-id="' + n.id + '" data-s="' + (n.session_id || "") + '">Open session</button>' +
    '<button class="btn btn-ghost btn-sm" data-act="nudge-seen" data-id="' + n.id + '">Done</button></div>').join("");
  let view = "";
  if (nav === "vision") view = viewVision();
  else if (nav === "plan") view = viewPlan();
  else if (nav === "sessions") view = viewSessions();
  else if (nav === "decisions") view = viewDecisions();
  else if (nav === "updates") view = viewUpdates();
  else if (nav === "docs") view = viewDocs();
  else if (nav === "podcast") view = viewPodcast();
  else if (nav === "ask") view = viewAsk();
  app.innerHTML =
  '<div class="app"><aside class="side">' +
    '<div class="brand"><div class="mark">XHB</div><div class="rule"></div><div class="sub">Founders’ HQ</div><div class="co">built by <b>MomenCrafts</b></div></div>' +
    '<nav class="nav">' + navBtn("vision", "Vision") + navBtn("plan", "Plan", counts.plan) + navBtn("sessions", "Q&A sessions", counts.sessions) + navBtn("decisions", "Decisions", counts.decisions) + navBtn("updates", "Updates") + navBtn("docs", "Documents") + navBtn("podcast", "Podcast 🎧") + navBtn("ask", "Ask XHB") + '</nav>' +
    '<div class="whoami"><b>' + esc(me.name) + '</b>' + esc(me.email) + '<div style="margin-top:5px;">Partner: ' + esc(partnerOf(me.email).name) + '</div>' +
    (LIVE ? '<div style="margin-top:8px;"><button class="link" data-act="signout">Sign out</button></div>' : "") + '</div>' +
  '</aside><main class="main">' +
    (!LIVE ? '<div class="demo-banner">Demo mode — sample data, nothing is saved. Run supabase_setup_v2.sql and fill the CONFIG block to go live.</div>' : "") +
    nb + view + '</main></div>';
}
/* ---- Gate UI: email magic-link flow ---- */
let gateEmail = "";
let resendCooldown = 0;
let resendTimer = null;

function renderGateIdentify(msg) {
  app.innerHTML =
  '<div class="center-wrap"><div class="authcard"><div class="mark">XHB</div><div class="rule"></div>' +
    '<h2 class="serif" style="margin-bottom:8px;">Founders’ HQ</h2>' +
    '<p dir="auto">Private workspace — restricted to registered founders.<br>' +
    'مساحة خاصة — مقيدة للمؤسسين المسجلين.</p>' +
    '<div style="display:flex; flex-direction:column; gap:12px; margin:16px 0;">' +
    '<div><label for="gate-email" style="font-size:12px; color:var(--muted);">Email</label>' +
    '<input type="email" id="gate-email" placeholder="you@example.com" autocomplete="email" dir="auto" style="width:100%; min-height:44px; box-sizing:border-box;" /></div>' +
    '<button class="btn btn-gold" data-act="gate-send" style="min-height:44px;">Send magic link</button></div>' +
    '<div class="msg">' + esc(msg || "") + '</div>' +
    '<p style="margin-top:16px; font-size:11.5px;">built by MomenCrafts · momencrafts.com</p></div></div>';
  const emailInp = document.getElementById("gate-email");
  if (gateEmail && emailInp) emailInp.value = gateEmail;
  if (emailInp) emailInp.addEventListener("keydown", (e) => { if (e.key === "Enter") document.querySelector('[data-act="gate-send"]')?.click(); });
}

function renderGateCheckEmail(msg) {
  app.innerHTML =
  '<div class="center-wrap"><div class="authcard"><div class="mark">XHB</div><div class="rule"></div>' +
    '<h2 class="serif" style="margin-bottom:8px;">Check your email</h2>' +
    '<p dir="auto">A magic link was sent to <b>' + esc(gateEmail) + '</b>.<br>Click the link in your email to sign in.<br><br>' +
    'تم إرسال رابط تسجيل الدخول إلى بريدك الإلكتروني.</p>' +
    '<div style="margin-top:16px; display:flex; justify-content:space-between; font-size:12px;">' +
    '<a href="#" data-act="gate-resend" style="color:var(--gold-soft); text-decoration:none;' + (resendCooldown > 0 ? ' opacity:0.4; pointer-events:none;' : '') + '">' +
    (resendCooldown > 0 ? 'Resend in ' + resendCooldown + 's' : 'Resend link') + '</a>' +
    '<a href="#" data-act="gate-restart" style="color:var(--muted); text-decoration:none;">Use different email</a>' +
    '</div>' +
    '<div class="msg" style="margin-top:12px;">' + esc(msg || "") + '</div>' +
    '<p style="margin-top:16px; font-size:11.5px;">built by MomenCrafts · momencrafts.com</p></div></div>';
}

function renderAuth(msg) {
  renderGateIdentify(msg);
}

function startResendCooldown() {
  resendCooldown = 60;
  clearInterval(resendTimer);
  resendTimer = setInterval(() => {
    resendCooldown--;
    if (resendCooldown <= 0) { clearInterval(resendTimer); resendTimer = null; }
    const link = document.querySelector('[data-act="gate-resend"]');
    if (link) {
      link.textContent = resendCooldown > 0 ? 'Resend in ' + resendCooldown + 's' : 'Resend link';
      link.style.opacity = resendCooldown > 0 ? '0.4' : '1';
      link.style.pointerEvents = resendCooldown > 0 ? 'none' : 'auto';
    }
  }, 1000);
}

let toastTimer = null;
function toast(text) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div"); el.className = "toast"; el.textContent = text;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
}

/* ----- Modals ----- */
function openNewSessionModal() {
  const ov = document.createElement("div"); ov.className = "overlay";
  const opts = Object.entries(TEMPLATES).map(([k, t]) => '<option value="' + k + '">' + esc(t.name) + '</option>').join("");
  ov.innerHTML = '<div class="modal"><h2 class="serif">New alignment session</h2><div class="grid">' +
    '<div><label>Title</label><input dir="auto" id="ns-title" /></div>' +
    '<div><label>Start from</label><select id="ns-tpl">' + opts + '</select><div class="tpl-desc" id="ns-desc" style="margin-top:6px;"></div></div></div>' +
    '<div class="foot"><button class="btn btn-ghost btn-sm" data-close="1">Cancel</button><button class="btn btn-gold btn-sm" id="ns-create">Create session</button></div></div>';
  document.body.appendChild(ov);
  const tplSel = ov.querySelector("#ns-tpl"), desc = ov.querySelector("#ns-desc"), title = ov.querySelector("#ns-title");
  const sync = () => { const t = TEMPLATES[tplSel.value]; desc.textContent = t.desc + (t.questions.length ? " (" + t.questions.length + " starter questions)" : ""); if (!title.value || Object.values(TEMPLATES).some(x => x.name === title.value)) title.value = t.name === "Blank session" ? "" : t.name; };
  tplSel.value = "founding"; sync(); tplSel.addEventListener("change", sync);
  ov.addEventListener("click", (e) => {
    if (e.target === ov || e.target.dataset.close) { ov.remove(); return; }
    if (e.target.id === "ns-create") { const t = title.value.trim() || TEMPLATES[tplSel.value].name; ov.remove(); createSession(t, tplSel.value); }
  });
}
function openNudgeModal() {
  const partner = partnerOf(me.email);
  const open = questions.filter(q => q.status === "sealed").length;
  const defMsg = "Salam " + partner.name + " — the session “" + (currentSession ? currentSession.title : "") + "” is ready: " + open + " question(s) awaiting your sealed answers. Please add yours so we can reveal, align and revise together.";
  const link = window.location.href.split("#")[0];
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = '<div class="modal"><h2 class="serif">Push to ' + esc(partner.name) + '</h2><div class="grid">' +
    '<div><label>Message</label><textarea dir="auto" id="ng-msg">' + esc(defMsg) + '</textarea></div>' +
    '<div class="tpl-desc">Sends an in-app nudge (banner on ' + esc(partner.name) + '’s next visit). Use the share buttons to also reach him on WhatsApp or email with the link.</div></div>' +
    '<div class="foot"><button class="btn btn-ghost btn-sm" data-close="1">Cancel</button>' +
    '<button class="btn btn-ghost btn-sm" id="ng-wa">WhatsApp</button>' +
    '<button class="btn btn-ghost btn-sm" id="ng-mail">Email</button>' +
    '<button class="btn btn-gold btn-sm" id="ng-send">Send nudge</button></div></div>';
  document.body.appendChild(ov);
  const getMsg = () => ov.querySelector("#ng-msg").value.trim();
  ov.addEventListener("click", async (e) => {
    if (e.target === ov || e.target.dataset.close) { ov.remove(); return; }
    if (e.target.id === "ng-wa") { window.open("https://wa.me/?text=" + encodeURIComponent(getMsg() + "\n\n" + link), "_blank"); }
    if (e.target.id === "ng-mail") { window.open("mailto:" + (partner.email || "") + "?subject=" + encodeURIComponent("XHB — alignment session ready") + "&body=" + encodeURIComponent(getMsg() + "\n\n" + link)); }
    if (e.target.id === "ng-send") {
      ov.remove();
      await dbInsert("nudges", { session_id: currentSession ? currentSession.id : null, from_email: norm(me.email), to_email: partner.email, message: getMsg(), seen: false }, nudges);
      toast("Nudge sent to " + partner.name + " ✓");
    }
  });
}

/* ----- Ask handler ----- */
async function doAsk() {
  const q = document.getElementById("ask-q").value.trim();
  if (!q) { toast("Type a question first."); return; }
  askBusy = true; render();
  if (!LIVE) {
    await new Promise(r => setTimeout(r, 600));
    askAnswer = "Demo mode — no model connected.\n\nOnce live, Ask-XHB will answer from your venture record. For “" + q + "” it would draw on: " + resolvedCache.length + " logged decision(s), " + planItems.length + " plan item(s), " + updatesFeed.length + " update(s), and any document text you have stored — and it will say “not reliably answerable from the record” when the evidence is not there, instead of guessing.";
    askBusy = false; render(); return;
  }
  try {
    const { data, error } = await sb.functions.invoke("ask-xhb", { body: { question: q } });
    askAnswer = error ? ("Ask-XHB is not configured yet (" + error.message + "). See DEPLOY_GUIDE §Ask-XHB.") : (data && data.answer ? data.answer : "No answer returned.");
  } catch (e) { askAnswer = "Ask-XHB is not configured yet. See DEPLOY_GUIDE §Ask-XHB."; }
  askBusy = false; render();
}

/* ------------------------------ Events ------------------------------------ */
document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const q = btn.dataset.q ? questions.find(x => x.id === btn.dataset.q) : null;

  if (act === "gate-send") {
    const email = norm(document.getElementById("gate-email")?.value || "");
    if (!email) { renderGateIdentify("Enter your email address."); return; }
    gateEmail = email;
    const sendBtn = document.querySelector('[data-act="gate-send"]');
    if (sendBtn) { sendBtn.textContent = "Sending…"; sendBtn.disabled = true; }
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin + '/xhb/' }
    });
    if (error) {
      renderGateIdentify("Could not send link: " + error.message);
      return;
    }
    startResendCooldown();
    renderGateCheckEmail();
    return;
  }
  if (act === "gate-resend") {
    if (resendCooldown > 0) return;
    await sb.auth.signInWithOtp({
      email: gateEmail,
      options: { emailRedirectTo: window.location.origin + '/xhb/' }
    });
    startResendCooldown();
    renderGateCheckEmail("Link resent.");
    return;
  }
  if (act === "gate-restart") {
    gateAttempts = 0; clearInterval(resendTimer); resendCooldown = 0;
    renderGateIdentify();
    return;
  }
  if (act === "signout") { await sb.auth.signOut(); me = null; render(); }
  if (act === "nav") { nav = btn.dataset.nav; if (nav === "decisions") resolvedCache = await loadAllResolved(); render(); }
  if (act === "open") { currentSession = sessions.find(s => s.id === btn.dataset.s); await loadQuestions(); render(); }
  if (act === "new-session") openNewSessionModal();
  if (act === "refresh") { await refresh(); toast("Refreshed"); }
  if (act === "addq") {
    const p = document.getElementById("new-q").value.trim(), c = document.getElementById("new-ctx").value.trim();
    if (!p) { toast("Write the question first."); return; }
    await addQuestion(p, c);
  }
  if (act === "save" && q) { await saveAnswer(q, document.getElementById("ans-" + q.id).value); }
  if (act === "force" && q) { confirmReveal[q.id] = true; render(); }
  if (act === "reveal" && q) { confirmReveal[q.id] = false; await setQuestion(q, { status: "revealed" }); }
  if (act === "reopen" && q) { await setQuestion(q, { status: "revealed" }); }
  if (act === "resolve" && q) {
    const outcome = document.getElementById("out-" + q.id).value;
    const decision = document.getElementById("dec-" + q.id).value.trim();
    const owner = document.getElementById("own-" + q.id).value.trim();
    if (outcome !== "aligned" && !decision) { toast("Record what was agreed (or choose 'Aligned as-is')."); return; }
    await setQuestion(q, { status: "resolved", outcome, decision, decision_owner: owner, resolved_at: now() });
    toast("Outcome logged ✓");
  }
  if (act === "export") exportMarkdown();
  if (act === "plan-cycle") {
    const it = planItems.find(x => x.id === btn.dataset.id);
    if (it) { const nx = PLAN_STATUS[(PLAN_STATUS.indexOf(it.status) + 1) % PLAN_STATUS.length]; await dbUpdate("plan_items", it.id, { status: nx }, planItems); }
  }
  if (act === "plan-add") {
    const t = document.getElementById("plan-title").value.trim();
    if (!t) { toast("Write the milestone first."); return; }
    await dbInsert("plan_items", { title: t, detail: "", phase: document.getElementById("plan-phase").value, status: "next", owner: document.getElementById("plan-owner").value.trim(), due: document.getElementById("plan-due").value.trim(), position: planItems.length, created_by: norm(me.email) }, planItems);
  }
  if (act === "up-post") {
    const b = document.getElementById("up-body").value.trim();
    if (!b) { toast("Write the update first."); return; }
    await dbInsert("updates", { author_email: norm(me.email), body: b, pinned: false }, updatesFeed);
  }
  if (act === "up-pin") {
    const it = updatesFeed.find(x => x.id === btn.dataset.id);
    if (it) await dbUpdate("updates", it.id, { pinned: !it.pinned }, updatesFeed);
  }
  if (act === "doc-add") {
    const t = document.getElementById("doc-title").value.trim();
    if (!t) { toast("Write the title first."); return; }
    await dbInsert("documents", { title: t, kind: document.getElementById("doc-kind").value, status: document.getElementById("doc-status").value.trim(), url: "", approvals: {}, created_by: norm(me.email) }, docsList);
  }
  if (act === "doc-approve") {
    const d = docsList.find(x => x.id === btn.dataset.id);
    if (d) { const appr = { ...(d.approvals || {}) }; appr[norm(me.email)] = new Date().toISOString().slice(0, 10); await dbUpdate("documents", d.id, { approvals: appr }, docsList); toast("Approval recorded ✓"); }
  }
  if (act === "nudge") openNudgeModal();
  if (act === "nudge-seen") { const n = nudges.find(x => x.id === btn.dataset.id); if (n) await dbUpdate("nudges", n.id, { seen: true }, nudges); }
  if (act === "nudge-open") {
    const n = nudges.find(x => x.id === btn.dataset.id);
    if (n) { await dbUpdate("nudges", n.id, { seen: true }, nudges); if (n.session_id) { currentSession = sessions.find(s => s.id === n.session_id) || currentSession; } nav = "sessions"; await loadQuestions(); render(); }
  }
  if (act === "ep-add") {
    const t = document.getElementById("ep-title").value.trim(), u = document.getElementById("ep-url").value.trim();
    if (!t) { toast("Give the episode a title."); return; }
    await dbInsert("episodes", { title: t, url: u, note: "", created_by: norm(me.email) }, episodesList);
  }
  if (act === "ep-play") {
    const ep = episodesList.find(x => x.id === btn.dataset.id);
    if (!ep) return;
    if (!ep.url) { toast("No audio link on this episode yet — add a direct MP3 URL."); return; }
    if (currentEp && currentEp.id === ep.id) {
      if (audioEl.paused) audioEl.play().catch(() => toast("Could not play — check the audio URL."));
      else audioEl.pause();
    } else {
      currentEp = ep; audioEl.src = ep.url;
      audioEl.play().catch(() => toast("Could not play — check the audio URL."));
    }
    renderPlayer(); render();
  }
  if (act === "pl-toggle") { if (audioEl.paused) audioEl.play().catch(() => {}); else audioEl.pause(); renderPlayer(); }
  if (act === "pl-close") { audioEl.pause(); currentEp = null; renderPlayer(); if (nav === "podcast") render(); }
  if (act === "ask") doAsk();
});

/* ------------------------------- Boot ------------------------------ */
/* Decision: persistSession: false — every page refresh re-runs OTP.
   This is deliberate: the gate is the only entry point, and no session
   data should survive a browser close. Surface this in the changelog
   as a decision for the founders to review. */

async function boot() {
  if (!LIVE) { me = { ...DEMO_ME }; demoSeed(); resolvedCache = await loadAllResolved(); render(); return; }
  if (!window.supabase) { app.innerHTML = '<div class="center-wrap"><div class="authcard"><h2>Supabase library failed to load</h2><p>Check your network or the CDN script tag.</p></div></div>'; return; }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  sb.auth.onAuthStateChange(async (_evt, session) => {
    if (session && session.user) {
      // Resolve identity: phone-OTP sessions may lack email
      const rawEmail = session.user.email || '';
      const rawPhone = session.user.phone || '';
      me = { email: norm(rawEmail), phone: rawPhone, name: "" };
      await loadMembers();
      // For phone-only auth, resolve email from allowed_users
      if (!me.email && rawPhone) {
        const phoneMember = members.find(x => x.phone === rawPhone);
        if (phoneMember) me.email = norm(phoneMember.email);
      }
      const self = members.find(x => norm(x.email) === me.email);
      if (!self) { renderGateIdentify("This identity is not on the allowlist."); me = null; return; }
      me.name = self.display_name || nameFor(me.email);
      await loadVisionContent();
      await loadTemplateContent();
      await refresh();
      resolvedCache = await loadAllResolved();
      subscribeRealtime();
      render();
    } else { me = null; render(); }
  });
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) renderGateIdentify();
}
boot();
