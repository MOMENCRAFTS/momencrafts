/* ----- Ask handler ----- */
async function doAsk() {
  const q = document.getElementById("ask-q").value.trim();
  if (!q) { toast("Type a question first."); return; }
  askBusy = true; render();
  if (!LIVE) {
    await new Promise(r => setTimeout(r, 600));
    askAnswer = "Demo mode — no model connected.\n\nOnce live, Ask-XHB will answer from your venture record. For “" + q + "” it would draw on: " + resolvedCache.length + " logged decision(s), " + planItems.length + " plan item(s), " + updatesFeed.length + " update(s), and any document text you have stored — and it will say “not reliably answerable from the record” when the evidence is not there, instead of guessing.";
    askBusy = false; render(); return;
  }
  try {
    const { data, error } = await sb.functions.invoke("ask-xhb", { body: { question: q } });
    askAnswer = error ? ("Ask-XHB is not configured yet (" + error.message + "). See DEPLOY_GUIDE §Ask-XHB.") : (data && data.answer ? data.answer : "No answer returned.");
  } catch (e) { askAnswer = "Ask-XHB is not configured yet. See DEPLOY_GUIDE §Ask-XHB."; }
  askBusy = false; render();
}

document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const q = btn.dataset.q ? questions.find(x => x.id === btn.dataset.q) : null;

  if (act === "gate-send") {
    const emailInput = document.getElementById("gate-email");
    if (!emailInput || !emailInput.value.trim()) { toast("Enter your email."); return; }
    gateEmail = emailInput.value.trim();
    const { error } = await sb.auth.signInWithOtp({ email: gateEmail, options: { emailRedirectTo: window.location.origin + '/xhb/' } });
    if (error) { renderGateIdentify("Error: " + error.message); return; }
    renderGateLinkSent("");
    return;
  }
  if (act === "gate-restart") { e.preventDefault(); renderGateIdentify(""); return; }
  if (act === "signout") { await sb.auth.signOut(); me = null; render(); window.location.href = "/"; }
  if (act === "nav") { nav = btn.dataset.nav; if (nav === "decisions") resolvedCache = await loadAllResolved(); render(); }
  if (act === "open") { currentSession = sessions.find(s => s.id === btn.dataset.s); await loadQuestions(); render(); }
  if (act === "new-session") openNewSessionModal();
  if (act === "refresh") { await refresh(); toast("Refreshed"); }
  if (act === "addq") {
    const p = document.getElementById("new-q").value.trim(), c = document.getElementById("new-ctx").value.trim();
    if (!p) { toast("Write the question first."); return; }
    await addQuestion(p, c);
  }
  if (act === "save" && q) { await saveAnswer(q, document.getElementById("ans-" + q.id).value); }
  if (act === "force" && q) { confirmReveal[q.id] = true; render(); }
  if (act === "reveal" && q) { confirmReveal[q.id] = false; await setQuestion(q, { status: "revealed" }); }
  if (act === "reopen" && q) { await setQuestion(q, { status: "revealed" }); }
  if (act === "resolve" && q) {
    const outcome = document.getElementById("out-" + q.id).value;
    const decision = document.getElementById("dec-" + q.id).value.trim();
    const owner = document.getElementById("own-" + q.id).value.trim();
    if (outcome !== "aligned" && !decision) { toast("Record what was agreed (or choose 'Aligned as-is')."); return; }
    await setQuestion(q, { status: "resolved", outcome, decision, decision_owner: owner, resolved_at: now() });
    toast("Outcome logged ✓");
  }
  if (act === "export") exportMarkdown();
  if (act === "plan-cycle") {
    const it = planItems.find(x => x.id === btn.dataset.id);
    if (it) { const nx = PLAN_STATUS[(PLAN_STATUS.indexOf(it.status) + 1) % PLAN_STATUS.length]; await dbUpdate("plan_items", it.id, { status: nx }, planItems); }
  }
  if (act === "plan-add") {
    const t = document.getElementById("plan-title").value.trim();
    if (!t) { toast("Write the milestone first."); return; }
    await dbInsert("plan_items", { title: t, detail: "", phase: document.getElementById("plan-phase").value, status: "next", owner: document.getElementById("plan-owner").value.trim(), due: document.getElementById("plan-due").value.trim(), position: planItems.length, created_by: norm(me.email) }, planItems);
  }
  if (act === "up-post") {
    const b = document.getElementById("up-body").value.trim();
    if (!b) { toast("Write the update first."); return; }
    await dbInsert("updates", { author_email: norm(me.email), body: b, pinned: false }, updatesFeed);
  }
  if (act === "up-pin") {
    const it = updatesFeed.find(x => x.id === btn.dataset.id);
    if (it) await dbUpdate("updates", it.id, { pinned: !it.pinned }, updatesFeed);
  }
  if (act === "doc-add") {
    const t = document.getElementById("doc-title").value.trim();
    if (!t) { toast("Write the title first."); return; }
    await dbInsert("documents", { title: t, kind: document.getElementById("doc-kind").value, status: document.getElementById("doc-status").value.trim(), url: "", approvals: {}, created_by: norm(me.email) }, docsList);
  }
  if (act === "doc-approve") {
    const d = docsList.find(x => x.id === btn.dataset.id);
    if (d) { const appr = { ...(d.approvals || {}) }; appr[norm(me.email)] = new Date().toISOString().slice(0, 10); await dbUpdate("documents", d.id, { approvals: appr }, docsList); toast("Approval recorded ✓"); }
  }
  if (act === "nudge") openNudgeModal();
  if (act === "nudge-seen") { const n = nudges.find(x => x.id === btn.dataset.id); if (n) await dbUpdate("nudges", n.id, { seen: true }, nudges); }
  if (act === "nudge-open") {
    const n = nudges.find(x => x.id === btn.dataset.id);
    if (n) { await dbUpdate("nudges", n.id, { seen: true }, nudges); if (n.session_id) { currentSession = sessions.find(s => s.id === n.session_id) || currentSession; } nav = "sessions"; await loadQuestions(); render(); }
  }
  if (act === "ep-add") {
    const t = document.getElementById("ep-title").value.trim(), u = document.getElementById("ep-url").value.trim();
    if (!t) { toast("Give the episode a title."); return; }
    await dbInsert("episodes", { title: t, url: u, note: "", created_by: norm(me.email) }, episodesList);
  }
  if (act === "ep-play") {
    const ep = episodesList.find(x => x.id === btn.dataset.id);
    if (!ep) return;
    if (!ep.url) { toast("No audio link on this episode yet \u2014 add a direct MP3 URL."); return; }
    // Auto-loop music tracks
    if (ep.title.toLowerCase().includes('music') || ep.title.toLowerCase().includes('ambient')) _loopEnabled = false;
    if (currentEp && currentEp.id === ep.id) {
      if (audioEl.paused) { audioEl.volume = 0; audioEl.play().then(() => fadeAudio(1, 800)).catch(() => toast("Could not play.")); }
      else pauseWithFade();
    } else {
      currentEp = ep;
      playWithFade(ep.url);
    }
    renderPlayer(); render();
  }
  if (act === "pl-toggle") {
    if (audioEl.paused) { audioEl.volume = 0; audioEl.play().then(() => fadeAudio(1, 800)).catch(() => {}); }
    else pauseWithFade();
    renderPlayer();
  }
  if (act === "pl-loop") { _loopEnabled = !_loopEnabled; audioEl.loop = _loopEnabled; renderPlayer(); if (nav === "podcast") render(); toast(_loopEnabled ? "\uD83D\uDD01 Loop on" : "Loop off"); }
  if (act === "pl-close") { _dockVisible = false; renderPlayer(); }
  if (act === "pl-seek") {
    const bar = btn.querySelector('.pl-bar-bg') || btn.closest('.pl-progress')?.querySelector('.pl-bar-bg');
    if (bar && audioEl.duration) {
      const rect = bar.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const pct = Math.max(0, Math.min(1, x / rect.width));
      audioEl.currentTime = pct * audioEl.duration;
      renderPlayer();
    }
  }
  if (act === "pl-skip") {
    const dir = parseInt(btn.dataset.dir || "15");
    audioEl.currentTime = Math.max(0, Math.min(audioEl.duration || 0, audioEl.currentTime + dir));
    renderPlayer();
  }
  if (act === "pl-speed") {
    _speedIdx = (_speedIdx + 1) % SPEEDS.length;
    audioEl.playbackRate = SPEEDS[_speedIdx];
    renderPlayer();
    if (nav === "podcast") render();
    toast("Speed: " + SPEEDS[_speedIdx] + "x");
  }
  if (act === "ask") doAsk();

  /* ---- Artifacts ---- */
  if (act === "art-open" || act === "art-open-from-vision") {
    if (act === "art-open-from-vision") nav = "artifacts";
    await loadArtifactDetail(btn.dataset.id); render();
  }
  if (act === "art-back") { currentArtifact = null; artEditing = false; artEditorBody = ""; render(); }
  if (act === "art-create") {
    const t = document.getElementById("art-title")?.value.trim();
    const k = document.getElementById("art-kind")?.value;
    if (!t) { toast("Give the artifact a title."); return; }
    await createArtifact(t, k);
  }
  if (act === "art-edit") { artEditing = true; artEditorBody = ""; render(); }
  if (act === "art-edit-cancel") { artEditing = false; artEditorBody = ""; render(); }
  if (act === "art-publish") {
    const body = document.getElementById("art-editor-body")?.value || "";
    const note = document.getElementById("art-change-note")?.value || "";
    if (!body.trim()) { toast("Write some content first."); return; }
    await publishArtifactVersion(body, note);
  }
  if (act === "art-verdict") {
    const v = btn.dataset.v;
    if (v) await setArtifactVerdict(v);
  }
  if (act === "art-raise-finding") {
    const body = document.getElementById("finding-body")?.value || "";
    const sev = document.getElementById("finding-sev")?.value || "question";
    const anchorEl = document.getElementById("finding-anchor");
    const anchor = anchorEl ? anchorEl.value : "";
    await raiseFinding(sev, body, anchor || null);
  }
  if (act === "art-respond") {
    const fid = btn.dataset.fid;
    const respEl = document.getElementById("resp-" + fid);
    const response = respEl ? respEl.value : "";
    await respondToFinding(fid, response);
  }
  if (act === "art-resolve-finding") {
    await resolveFinding(btn.dataset.fid, btn.dataset.fs);
  }
  if (act === "art-lock") { await lockArtifact(); }
  if (act === "art-unlock") { await unlockArtifact(); }

  /* ---- Onboarding music toggle ---- */
  if (act === "ob-music-toggle") {
    if (!audioEl.paused) {
      pauseWithFade();
    } else {
      const musicEp = episodesList.find(ep => ep.title.toLowerCase().includes('music') || ep.title.toLowerCase().includes('ambient'));
      if (musicEp && musicEp.url) {
        currentEp = musicEp;
        _loopEnabled = false;
        playWithFade(musicEp.url);
      } else {
        toast("No music track uploaded yet.");
      }
    }
    setTimeout(render, 300);
    return;
  }

  /* ---- Onboarding alignment ---- */
  if (act === "ob-approve") {
    // Safety: builder cannot approve before approver annotates
    const itemDisps = alignmentDispositions.filter(d => d.item_id === btn.dataset.item);
    const hasAnnotation = itemDisps.some(d => d.disposition === 'annotate');
    if (!hasAnnotation) { toast("Wait for the design answer before approving."); return; }
    await setDisposition(btn.dataset.item, "approve", "");
  }
  if (act === "ob-annotate-start") {
    const form = document.getElementById("ob-ann-" + btn.dataset.item);
    if (form) form.style.display = form.style.display === "none" ? "block" : "none";

  }
  if (act === "ob-annotate-submit") {
    const note = document.getElementById("ob-note-" + btn.dataset.item)?.value || "";
    if (!note.trim()) { toast("Write what needs to change."); return; }
    await setDisposition(btn.dataset.item, "annotate", note);
    localStorage.removeItem('xhb-draft-' + btn.dataset.item); // Clear draft on save
  }
  if (act === "ob-delete-annotation") {
    const itemId = btn.dataset.item;
    const email = norm(me.email);
    const { error } = await db().from("alignment_dispositions").delete().eq("item_id", itemId).eq("email", email);
    if (error) { toast("Could not delete: " + error.message); return; }
    await loadAlignmentDispositions();
    toast("\uD83D\uDDD1 Annotation deleted \u2014 reset to pending");
    render();
    return;
  }
  if (act === "ob-complete") {
    await completeOnboarding();
  }
  if (act === "ob-contest-start") {
    const form = document.getElementById("ob-contest-" + btn.dataset.item);
    if (form) form.style.display = form.style.display === "none" ? "block" : "none";
    return;
  }
  if (act === "ob-contest-submit") {
    const reason = document.getElementById("ob-contest-reason-" + btn.dataset.item)?.value || "";
    if (!reason.trim()) { toast("You must explain what you need before you can build this."); return; }
    await setDisposition(btn.dataset.item, "contest", "", reason);
    localStorage.removeItem('xhb-contest-' + btn.dataset.item);
  }
  if (act === "ob-export-round") {
    const roundNum = parseInt(btn.dataset.round);
    let md = "# Alignment Record — Round " + roundNum + "\n\nExported " + new Date().toISOString().slice(0, 10) + "\n\n---\n\n";
    const roundItems = alignmentItems.filter(i => (i.round || 1) === roundNum && i.round_status === 'published');
    roundItems.forEach((item, idx) => {
      const disps = alignmentDispositions.filter(d => d.item_id === item.id);
      const annD = disps.find(d => d.disposition === 'annotate');
      const apprD = disps.find(d => d.disposition === 'approve');
      md += "### " + (idx + 1) + ". " + item.title + "\n";
      if (item.body_md) md += item.body_md + "\n\n";
      if (annD && annD.note) md += "**Design answer (" + nameFor(annD.email) + "):** " + annD.note + "\n";
      if (apprD) md += "**Approved by " + nameFor(apprD.email) + "** " + (apprD.updated_at || "") + "\n";
      md += "\n";
    });
    const blob = new Blob([md], { type: "text/markdown" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "alignment-round-" + roundNum + ".md";
    a.click();
    URL.revokeObjectURL(a.href);
    toast("📋 Exported Round " + roundNum + " summary");
    return;
  }
  if (act === "ob-round") {
    window._obRound = parseInt(btn.dataset.round);
    render();
    return;
  }
  if (act === "ob-add-round") {
    window._showAddItems = true;
    render();
    return;
  }
  if (act === "ob-add-items-close") {
    window._showAddItems = false;
    render();
    return;
  }
  if (act === "ob-add-item-submit") {
    const title = document.getElementById("new-item-title")?.value?.trim();
    const body = document.getElementById("new-item-body")?.value?.trim();
    const category = document.getElementById("new-item-category")?.value?.trim() || "General";
    if (!title) { toast("Give the decision a title."); return; }
    if (!body) { toast("Give the decision a body."); return; }
    const nextRound = (window._obRound || 1) + 1;
    // Count existing items in that round for positioning
    const existingInRound = alignmentItems.filter(i => i.round === nextRound).length;
    const { error } = await db().from("alignment_items").insert({
      title, body_md: body, category, position: existingInRound + 1,
      round: nextRound, round_status: "published"
    });
    if (error) { toast("Could not add: " + error.message); return; }
    await loadAlignmentItems();
    window._obRound = nextRound;
    toast("✅ Item added to Round " + nextRound);
    render();
    return;
  }

  /* ---- Voice recording (Whisper) ---- */
  if (act === "voice") {
    const targetId = btn.dataset.target;
    if (!targetId) return;
    handleVoiceToggle(btn, targetId);
    return; // don't re-render
  }
});

/* ---- Voice Review Panel (AI Refine) ---- */
function showVoiceReview(rawText, targetId, lang) {
  // Remove existing overlay if any
  const existing = document.querySelector('.voice-review-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'voice-review-overlay';
  overlay.innerHTML =
    '<div class="voice-review">' +
      '<h3>\uD83C\uDFA4 Voice Transcription Review</h3>' +
      '<div class="vr-label">\uD83D\uDCDD Raw transcription (' + esc(lang) + ')</div>' +
      '<div class="vr-text" id="vr-raw">' + esc(rawText) + '</div>' +
      '<div id="vr-improved-wrap" style="display:none;">' +
        '<div class="vr-label">\u2728 AI-improved version</div>' +
        '<div class="vr-text improved" id="vr-improved"></div>' +
        '<div class="vr-diff" id="vr-diff"></div>' +
      '</div>' +
      '<div class="vr-label">\u270E Edit before submitting</div>' +
      '<div class="vr-text"><textarea id="vr-edit" dir="auto">' + esc(rawText) + '</textarea></div>' +
      '<div class="vr-actions">' +
        '<button class="btn btn-ghost btn-sm" id="vr-discard">\u2715 Discard</button>' +
        '<button class="btn btn-ghost btn-sm" id="vr-improve">\u2728 Improve with AI</button>' +
        '<button class="btn btn-gold btn-sm" id="vr-approve">\u2714 Approve & Insert</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(overlay);

  // Discard
  document.getElementById('vr-discard').addEventListener('click', () => {
    overlay.remove();
    toast('Transcription discarded.');
  });

  // Approve — insert into target textarea
  document.getElementById('vr-approve').addEventListener('click', () => {
    const finalText = document.getElementById('vr-edit').value.trim();
    if (!finalText) { toast('Nothing to insert.'); return; }
    const textarea = document.getElementById(targetId);
    if (textarea) {
      const ex = textarea.value.trim();
      textarea.value = ex ? ex + '\n' + finalText : finalText;
      textarea.focus();
    }
    overlay.remove();
    toast('\u2714 Transcription inserted!');
  });

  // Improve with AI
  document.getElementById('vr-improve').addEventListener('click', async () => {
    const improveBtn = document.getElementById('vr-improve');
    const origLabel = improveBtn.innerHTML;
    improveBtn.disabled = true;
    improveBtn.innerHTML = '<span class="vr-spinner"></span> Improving\u2026';

    try {
      const editArea = document.getElementById('vr-edit');
      const textToImprove = editArea.value.trim() || rawText;

      const res = await fetch(CONFIG.SUPABASE_URL + '/functions/v1/xhb-refine', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + CONFIG.SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ text: textToImprove, lang: lang })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        toast('AI refine error: ' + (err.error || res.statusText));
        return;
      }

      const data = await res.json();
      const improved = (data.refined || data.text || '').trim();
      if (!improved) { toast('AI returned empty — keeping original.'); return; }

      // Show improved version
      document.getElementById('vr-improved').textContent = improved;
      document.getElementById('vr-improved-wrap').style.display = 'block';

      // Calculate word diff
      const origWords = textToImprove.split(/\s+/).length;
      const newWords = improved.split(/\s+/).length;
      const diff = newWords - origWords;
      document.getElementById('vr-diff').innerHTML =
        '<span class="saved">\u2714 AI refined</span> \u00b7 ' +
        origWords + ' \u2192 ' + newWords + ' words' +
        (diff !== 0 ? ' (' + (diff > 0 ? '+' : '') + diff + ')' : '');

      // Update edit area with improved version
      editArea.value = improved;

    } catch (err) {
      console.error('AI refine error:', err);
      toast('AI refine failed: ' + err.message);
    } finally {
      improveBtn.disabled = false;
      improveBtn.innerHTML = origLabel;
    }
  });
}

/* ---- Voice / Whisper transcription engine ---- */
let _voiceRecorder = null;
let _voiceChunks = [];
let _voiceBtn = null;
let _musicWasPlaying = false;
let _musicVolBefore = 1;

async function handleVoiceToggle(btn, targetId) {
  // If already recording, stop
  if (_voiceRecorder && _voiceRecorder.state === "recording" && _voiceBtn === btn) {
    _voiceRecorder.stop();
    return;
  }
  // If another recording is active, stop it first
  if (_voiceRecorder && _voiceRecorder.state === "recording") {
    _voiceRecorder.stop();
    await new Promise(r => setTimeout(r, 200));
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _voiceChunks = [];
    _voiceBtn = btn;
    btn.classList.add("recording");
    btn.textContent = "\u23F9"; // ⏹ stop icon

    // Duck background music
    _musicWasPlaying = !audioEl.paused;
    _musicVolBefore = audioEl.volume;
    if (_musicWasPlaying) {
      fadeAudio(0, 500);
    }

    _voiceRecorder = new MediaRecorder(stream, {
      mimeType: MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus"
        : MediaRecorder.isTypeSupported("audio/webm")
          ? "audio/webm"
          : MediaRecorder.isTypeSupported("audio/mp4")
            ? "audio/mp4"
            : "" // let browser choose default
    });

    _voiceRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) _voiceChunks.push(e.data);
    };

    _voiceRecorder.onstop = async () => {
      // Stop all tracks to release mic
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove("recording");
      btn.classList.add("transcribing");
      btn.textContent = "\u23F3"; // ⏳ hourglass

      try {
        const actualMime = _voiceRecorder.mimeType || "audio/webm";
        const ext = actualMime.includes("mp4") ? "m4a" : actualMime.includes("ogg") ? "ogg" : "webm";
        const blob = new Blob(_voiceChunks, { type: actualMime });
        if (blob.size < 1000) {
          toast("Recording too short \u2014 hold longer.");
          btn.classList.remove("transcribing");
          btn.textContent = "\uD83C\uDFA4";
          return;
        }

        const formData = new FormData();
        formData.append("audio", blob, "recording." + ext);
        // Auto-detect language (Whisper handles Arabic + English)

        const res = await fetch(CONFIG.SUPABASE_URL + "/functions/v1/xhb-whisper", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY
          },
          body: formData
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          toast("Whisper error: " + (err.error || res.statusText));
          btn.classList.remove("transcribing");
          btn.textContent = "\uD83C\uDFA4";
          return;
        }

        const result = await res.json();
        const text = (result.text || "").trim();
        if (!text) {
          toast("No speech detected — try again.");
          btn.classList.remove("transcribing");
          btn.textContent = "\uD83C\uDFA4";
          return;
        }

        // Show voice review panel instead of direct insert
        const langLabel = result.language || "auto";
        showVoiceReview(text, targetId, langLabel);
      } catch (err) {
        console.error("Whisper transcription error:", err);
        toast("Voice transcription failed: " + err.message);
      } finally {
        btn.classList.remove("transcribing");
        btn.textContent = "\uD83C\uDFA4";
        _voiceRecorder = null;
        _voiceBtn = null;
        // Restore music
        if (_musicWasPlaying && !audioEl.paused) {
          fadeAudio(_musicVolBefore, 800);
        } else if (_musicWasPlaying && audioEl.paused) {
          audioEl.volume = 0;
          audioEl.play().then(() => fadeAudio(_musicVolBefore, 800)).catch(() => {});
        }
      }
    };

    _voiceRecorder.start();
    toast("\uD83C\uDFA4 Recording\u2026 tap again to stop");

  } catch (err) {
    console.error("Mic access error:", err);
    if (err.name === "NotAllowedError") {
      toast("Microphone access denied — check browser permissions.");
    } else {
      toast("Could not access microphone: " + err.message);
    }
    btn.classList.remove("recording");
    btn.textContent = "\uD83C\uDFA4";
  }
}

/* ------------------------------- Boot ------------------------------ */
/* Access is decided by a REAL Supabase auth session + xhb.is_allowed() RLS.
   The MomenCrafts portal mints the session via the xhb-gate-request SSO
   function and persists it to localStorage (same origin, same project).
   /xhb/ simply calls getSession() — no tokens, no service keys in the browser. */

async function boot() {
  if (!LIVE) { me = { ...DEMO_ME }; demoSeed(); resolvedCache = await loadAllResolved(); render(); return; }
  if (!window.supabase) { app.innerHTML = '<div class="center-wrap"><div class="authcard"><h2>Supabase library failed to load</h2><p>Check your network or the CDN script tag.</p></div></div>'; return; }

  // ── Client: anon key only, same project ref as the portal ──
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true },
    db: { schema: 'xhb' }
  });

  // Helper: load app data and render
  async function enterApp(email) {
    document.body.classList.remove('gate-active');
    me = { email: norm(email), phone: '', name: '' };
    await loadMembers();
    const self = members.find(x => norm(x.email) === me.email) || members[0];
    if (self) { me.email = norm(self.email); me.name = self.display_name || nameFor(self.email); }
    else { me.name = email.split('@')[0] || 'Founder'; }
    dataLoading = true; render();
    await loadOnboardingStatus();
    await loadAlignmentItems();
    await loadAlignmentDispositions();
    await loadAlignmentHistory();
    await loadVisionContent();
    await loadTemplateContent();
    await refresh();
    resolvedCache = await loadAllResolved();
    dataLoading = false;
    subscribeRealtime();
    render();

    // Auto-start background music on first user interaction (browser requires gesture)
    if (!onboardingComplete) {
      const _autoPlayOnce = () => {
        document.removeEventListener('click', _autoPlayOnce);
        document.removeEventListener('touchstart', _autoPlayOnce);
        if (!audioEl.paused) return; // already playing
        const musicEp = episodesList.find(ep => ep.title.toLowerCase().includes('music') || ep.title.toLowerCase().includes('ambient'));
        if (musicEp && musicEp.url) {
          currentEp = musicEp;
          _loopEnabled = false;
          playWithFade(musicEp.url);
          setTimeout(render, 400);
        }
      };
      document.addEventListener('click', _autoPlayOnce, { once: true });
      document.addEventListener('touchstart', _autoPlayOnce, { once: true });
    }
  }

  // ── Register auth listener FIRST so magic-link hash tokens are captured ──
  sb.auth.onAuthStateChange(async (_evt, session) => {
    if (session && session.user) {
      await enterApp(session.user.email || '');
    } else if (_evt === 'SIGNED_OUT') { me = null; render(); }
  });

  // ── Check for magic-link hash tokens in URL ──
  const hash = window.location.hash;
  if (hash && (hash.includes('access_token') || hash.includes('type=magiclink') || hash.includes('type=signup'))) {
    // Supabase JS auto-detects hash tokens on init, but we need to wait for it
    // Show loading state while token is being processed
    app.innerHTML = '<div class="center-wrap"><div class="authcard"><div class="mark">XHB</div><div class="rule"></div><h2 class="serif">Signing you in\u2026</h2><p style="color:var(--muted);">Processing magic link.</p></div></div>';
    // Clean the hash from URL
    setTimeout(() => {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }, 500);
    // onAuthStateChange above will fire with the session
    return;
  }

  // ── Check for existing session (set by portal or prior visit) ──
  const { data: sessionData } = await sb.auth.getSession();
  if (sessionData && sessionData.session && sessionData.session.user) {
    await enterApp(sessionData.session.user.email || '');
    return;
  }

  // No session: check for break-glass recovery mode
  const params = new URLSearchParams(window.location.search);
  if (params.get('recover') === '1') {
    // Break-glass: show magic-link form (undocumented, for when portal SSO is down)
    renderGateIdentify('Portal SSO unavailable — use magic link to sign in.');
    return;
  }

  // No session, no recovery: redirect to MomenCrafts gate (replace prevents back-button loop)
  window.location.replace('/');
}
boot();

async function loadLibrary() {
  if (!LIVE || !sb) return;
  const { data, error } = await db().from('library').select('*').is('deleted_at', null).order('created_at', { ascending: false });
  if (error) { console.error('Library load error:', error); return; }
  libraryDocs = data || [];
  renderLibrary();
  updateLibPillCount();
}

function updateLibPillCount() {
  const pill = document.getElementById('library-pill');
  let countEl = pill.querySelector('.pill-count');
  if (libraryDocs.length > 0) {
    if (!countEl) { countEl = document.createElement('span'); countEl.className = 'pill-count'; pill.appendChild(countEl); }
    countEl.textContent = libraryDocs.length;
  } else if (countEl) {
    countEl.remove();
  }
}

function renderLibrary() {
  const list = document.getElementById('lib-list');
  if (libraryDocs.length === 0) {
    list.innerHTML = '<div class="lib-empty"><div class="emp-icon">\uD83D\uDCDA</div><div>No documents yet.<br>Upload a PDF to get started.</div></div>';
    return;
  }
  list.innerHTML = libraryDocs.map((doc, i) =>
    '<div class="lib-card" style="animation-delay:' + (i * 0.05) + 's">' +
      '<h3 dir="auto">' + esc(doc.title) + '</h3>' +
      '<div class="lib-summary" dir="auto" style="border-left:2px solid var(--gold-soft); padding-left:10px; margin-left:2px;">' +
      (doc.summary ? esc(doc.summary) : '<em style="opacity:0.5;">AI summary will appear on next upload with pdf.js loaded.</em>') + '</div>' +
      '<div class="lib-meta">' +
        '<span>\uD83D\uDCCE ' + esc(doc.file_name) + '</span>' +
        '<span>\u00b7 ' + fmtFileSize(doc.file_size) + '</span>' +
        '<span>\u00b7 ' + nameFor(doc.uploaded_by) + '</span>' +
        '<span>\u00b7 ' + timeAgo(doc.created_at) + '</span>' +
      '</div>' +
      '<div class="lib-actions">' +
        '<button class="btn btn-gold btn-sm" onclick="window.open(\'' + esc(doc.file_url) + '\', \'_blank\')">\uD83D\uDD17 Open PDF</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="deleteLibDoc(\'' + doc.id + '\')" style="color:#ef4444;">\uD83D\uDDD1 Delete</button>' +
      '</div>' +
    '</div>'
  ).join('');
}

function fmtFileSize(bytes) {
  if (!bytes) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  let size = bytes;
  while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
  return size.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function timeAgo(ts) {
  if (!ts) return '';
  const diff = (Date.now() - new Date(ts).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

async function handleLibUpload(file) {
  if (file.type !== 'application/pdf') { toast('Only PDF files are supported.'); return; }
  if (file.size > 50 * 1024 * 1024) { toast('File too large — max 50 MB.'); return; }
  if (!LIVE || !sb) { toast('Not connected to database.'); return; }

  toast('\uD83D\uDCC4 Uploading ' + file.name + '\u2026');

  // Show shimmer placeholder
  const list = document.getElementById('lib-list');
  const shimmer = document.createElement('div');
  shimmer.className = 'lib-shimmer';
  list.prepend(shimmer);

  try {
    // 1. Upload file to storage
    const fileId = crypto.randomUUID();
    const filePath = fileId + '.pdf';
    const { error: uploadErr } = await sb.storage.from('xhb-library').upload(filePath, file, { contentType: 'application/pdf' });
    if (uploadErr) { toast('Upload failed: ' + uploadErr.message); shimmer.remove(); return; }

    const fileUrl = CONFIG.SUPABASE_URL + '/storage/v1/object/public/xhb-library/' + filePath;

    // 2. Extract text from PDF (client-side)
    let extractedText = '';
    try {
      const arrayBuf = await file.arrayBuffer();
      if (window.pdfjsLib) {
        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuf }).promise;
        const pages = [];
        for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
          const page = await pdf.getPage(i);
          const tc = await page.getTextContent();
          pages.push(tc.items.map(item => item.str).join(' '));
        }
        extractedText = pages.join('\n\n');
      }
    } catch (pdfErr) {
      console.warn('PDF text extraction failed:', pdfErr);
    }

    // 3. AI summarize
    let title = file.name.replace(/\.pdf$/i, '');
    let summary = '';

    if (extractedText.length > 20) {
      try {
        const aiRes = await fetch(CONFIG.SUPABASE_URL + '/functions/v1/xhb-library-summarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CONFIG.SUPABASE_ANON_KEY },
          body: JSON.stringify({ text: extractedText, filename: file.name })
        });
        if (aiRes.ok) {
          const aiData = await aiRes.json();
          title = aiData.title || title;
          summary = aiData.summary || '';
        }
      } catch (aiErr) {
        console.warn('AI summarize failed:', aiErr);
      }
    }

    // 4. Save to database
    const { error: dbErr } = await db().from('library').insert({
      title, summary, file_url: fileUrl, file_name: file.name,
      file_size: file.size, uploaded_by: norm(me.email)
    });
    if (dbErr) { toast('Save failed: ' + dbErr.message); shimmer.remove(); return; }

    toast('\u2714 ' + title + ' uploaded!');
    await loadLibrary();

  } catch (err) {
    console.error('Upload error:', err);
    toast('Upload failed: ' + err.message);
  } finally {
    shimmer.remove();
  }
}

async function deleteLibDoc(id) {
  if (!LIVE || !sb) return;
  const { error } = await db().from('library').update({ deleted_at: new Date().toISOString() }).eq('id', id);
  if (error) { toast('Delete failed: ' + error.message); return; }
  toast('\uD83D\uDDD1 Document removed');
  await loadLibrary();
}

// Realtime subscription for library
function subscribeLibraryRealtime() {
  if (!LIVE || !sb) return;
  sb.channel('xhb-library-changes')
    .on('postgres_changes', { event: '*', schema: 'xhb', table: 'library' }, () => {
      loadLibrary();
    })
    .subscribe();
}

// Hook into boot — load library after auth
const _origEnterApp = window._origEnterApp;
// We'll call loadLibrary and subscribeLibraryRealtime after boot completes
setTimeout(() => {
  if (LIVE && sb && me) {
    loadLibrary();
    subscribeLibraryRealtime();
  }
}, 2000);

</script>
