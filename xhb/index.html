<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" type="image/svg+xml" href="/xhb/favicon.svg" />
<meta name="apple-mobile-web-app-title" content="XHB" />
<meta name="theme-color" content="#FFFFFF" />
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FFFFFF'/><text x='50' y='62' text-anchor='middle' font-size='36' font-weight='700' fill='%23B8863A'>XHB</text></svg>" />
<title>XHB Founders' HQ · MomenCrafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<style>
  :root{
    /* ── Phase 6 Premium White + Gold tokens ── */
    --bg:#FFFFFF; --panel:#FBFAF8; --panel-2:#F6F3EE;
    --ink:#17150F; --ink-2:#6B655C; --ink-3:#8C8578;
    --gold:#B8863A; --gold-text:#8A6320; --gold-deep:#7A5A1E; --gold-soft:#D9C39A;
    --ok:#4A8C3F; --warn:#C97A3A; --blue:#4A76A8;
    --line:rgba(23,21,15,.08); --border:rgba(23,21,15,.08);
    --radius:14px;
    /* ── Locked state ── */
    --locked-bg:#17150F; --locked-text:#F4EEDF;
    /* ── Sheen ── */
    --sheen:radial-gradient(ellipse 600px 400px at 90% -5%, rgba(184,134,58,.08) 0%, transparent 70%);
    /* ── Glass ── */
    --glass-bg:rgba(255,255,255,.72); --glass-blur:blur(14px); --glass-border:rgba(122,90,30,.18);
    /* ── Shadows ── */
    --shadow-card:0 2px 6px rgba(23,21,15,.05), 0 14px 40px rgba(23,21,15,.07);
    --shadow-sm:0 1px 3px rgba(23,21,15,.06);
    /* Legacy compat aliases */
    --plum:var(--panel-2); --night:var(--bg); --lavender:var(--ink-2);
    --cream:var(--ink); --cream-dim:var(--ink-2); --card:var(--bg); --card-deep:var(--panel);
    --gold-soft-legacy:#C9964A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    background-image:var(--sheen);
    background-attachment:fixed;
    color:var(--ink);
    font:15px/1.55 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  h1,h2,h3,.serif{font-family:'Fraunces', Georgia, serif; letter-spacing:.2px;}
  button{font:inherit; cursor:pointer; border:none; border-radius:9px;}
  input,textarea,select{font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:9px 11px; width:100%;}
  input:focus,textarea:focus,select:focus{outline:1.5px solid var(--gold); border-color:transparent;}
  textarea{min-height:88px; resize:vertical;}
  ::placeholder{color:var(--ink-3);}
  a{color:var(--gold-text);}

  .app{display:grid; grid-template-columns:270px 1fr; min-height:100vh;}
  /* ---------- Sidebar ---------- */
  .side{background:var(--panel); border-right:1px solid var(--glass-border); padding:24px 18px; display:flex; flex-direction:column; gap:18px;}
  .brand .mark{font-family:'Fraunces', Georgia, serif; font-size:28px; font-weight:700; letter-spacing:4px; color:var(--ink);}
  .brand .rule{width:44px; height:3px; background:var(--gold); margin:7px 0 7px;}
  .brand .sub{color:var(--ink-2); font-size:12px; letter-spacing:.6px; text-transform:uppercase;}
  .brand .co{margin-top:4px; font-size:11px; color:var(--ink-2);}
  .co b{color:var(--gold-text); font-weight:600;}
  .nav{display:flex; flex-direction:column; gap:5px; flex:1;}
  .nav button{background:transparent; text-align:left; color:var(--ink-2); border:1px solid transparent; padding:9px 12px; border-radius:10px; font-weight:600; font-size:14px; display:flex; justify-content:space-between; align-items:center; transition:all 0.15s;}
  .nav button:hover{color:var(--ink); border-color:var(--line);}
  .nav button.active{background:var(--bg); color:var(--ink); border-left:3px solid var(--gold); box-shadow:var(--shadow-sm);}
  .nav .cnt{font-size:11px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink-2); padding:1px 8px; border-radius:999px;}
  .whoami{border-top:1px solid var(--line); padding-top:12px; font-size:12px; color:var(--ink-2);}
  .whoami b{color:var(--ink); display:block; font-size:13px;}
  .link{background:none; color:var(--ink-2); text-decoration:underline; padding:0; font-size:12px;}

  .btn{padding:10px 14px; font-weight:600; transition:all 0.15s;}
  .btn-gold{background:var(--gold); color:var(--ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 2px 8px rgba(184,134,58,.2);}
  .btn-gold:hover{background:var(--gold-text); color:var(--panel);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-2);}
  .btn-sm{padding:7px 11px; font-size:13px; font-weight:600;}

  /* ---------- Main ---------- */
  .main{padding:26px 32px 70px; max-width:1060px; width:100%;}
  .demo-banner{background:linear-gradient(90deg, var(--gold) 0%, var(--gold-text) 100%); color:var(--panel); border-radius:10px; padding:10px 16px; font-size:13px; margin-bottom:16px; font-weight:600;}
  .nudge-banner{background:var(--plum); border:1px solid var(--gold); border-radius:12px; padding:13px 16px; margin-bottom:16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .nudge-banner .txt{flex:1; min-width:220px; font-size:13.5px;}
  .nudge-banner .txt b{color:var(--gold-soft);}
  .pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .pagehead h1{font-size:26px;}
  .pagehead .meta{color:var(--lavender); font-size:13px; margin-top:3px;}
  .hint{color:var(--cream-dim); font-size:13px; margin-bottom:16px; max-width:780px;}
  .hint b{color:var(--gold-soft);}

  .chip{font-size:11px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; padding:5px 11px; border-radius:999px; white-space:nowrap; display:inline-block;}
  .chip.sealed{background:#F8F5F0; color:var(--lavender); border:1px solid var(--lavender);}
  .chip.revealed{background:var(--gold); color:#F8F5F0;}
  .chip.aligned{background:var(--ok); color:#1E2A18;}
  .chip.divergent{background:var(--warn); color:#2A1708;}
  .chip.decided{background:var(--cream); color:var(--plum);}
  .chip.later{background:#F8F5F0; color:var(--cream-dim); border:1px solid var(--line);}
  .chip.next{background:var(--lavender); color:#F8F5F0;}
  .chip.now{background:var(--gold); color:#F8F5F0;}
  .chip.done{background:var(--ok); color:#1E2A18;}
  .chip.source{background:var(--gold); color:#F8F5F0;}
  .chip.derived{background:#F8F5F0; color:var(--lavender); border:1px solid var(--lavender);}
  .chip.legal{background:var(--cream); color:var(--plum);}
  .chip.other{background:#F8F5F0; color:var(--cream-dim); border:1px solid var(--line);}

  /* ---------- Vision ---------- */
  .v-quote{background:var(--plum); border-left:4px solid var(--gold); border-radius:0 var(--radius) var(--radius) 0; padding:20px 24px; font-family:Georgia, serif; font-size:19px; font-style:italic; margin-bottom:18px; line-height:1.6;}
  .v-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:13px; margin:16px 0;}
  .v-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
  .v-card h3{color:var(--gold-soft); font-size:16px; margin-bottom:7px;}
  .v-card p{font-size:13.5px; color:var(--cream-dim);}
  .v-sec{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 22px; margin-bottom:14px;}
  .v-sec h2{font-size:17px; color:var(--gold-soft); margin-bottom:10px;}
  .v-sec p{font-size:14px; margin-bottom:8px;}
  .v-sec ul{margin:4px 0 4px 20px; font-size:13.5px; color:var(--cream-dim);}
  .v-sec li{margin-bottom:5px;}
  .v-foot{font-size:12.5px; color:var(--cream-dim); margin-top:14px;}

  /* ---------- Plan ---------- */
  .phase-block{margin-bottom:20px;}
  .phase-block h2{font-size:15px; color:var(--gold-soft); letter-spacing:.8px; margin-bottom:9px;}
  .plan-item{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:11px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .plan-item .t{flex:1; min-width:220px; font-size:14px;}
  .plan-item .sub{display:block; font-size:12px; color:var(--cream-dim); margin-top:2px;}
  .plan-item .chipbtn{background:none; padding:0;}
  .addbar{background:var(--card); border:1px dashed var(--lavender); border-radius:var(--radius); padding:14px 16px; margin-top:10px; display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:9px; align-items:center;}

  /* ---------- Q&A (sessions) ---------- */
  .sess-chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .sess-chip{background:transparent; border:1px solid var(--line); color:var(--cream); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;}
  .sess-chip.active{background:var(--plum); border-color:var(--gold);}
  .qcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:19px 21px; margin-bottom:16px;}
  .qhead{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
  .qhead h3{font-size:17px; line-height:1.4; max-width:78%;}
  .qctx{color:var(--cream-dim); font-size:13px; margin-top:6px; max-width:80%;}
  .answers{display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-top:15px;}
  .apanel{background:var(--card-deep); border:1px solid var(--line); border-radius:11px; padding:12px 14px; min-height:110px; display:flex; flex-direction:column; gap:8px;}
  .apanel .who{font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--gold-soft);}
  .apanel .who.partner{color:var(--lavender);}
  .apanel .body{white-space:pre-wrap; font-size:14px;}
  .locked{display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; color:var(--cream-dim); gap:6px; text-align:center; font-size:13px;}
  .locked .ic{font-size:20px;}
  .saved-note{font-size:12px; color:var(--ok);}
  .qactions{display:flex; gap:10px; margin-top:13px; flex-wrap:wrap; align-items:center;}
  .qactions .note{font-size:12.5px; color:var(--cream-dim);}
  .resolve{margin-top:15px; border-top:1px dashed var(--line); padding-top:13px; display:grid; gap:10px;}
  .resolve .row{display:grid; grid-template-columns:170px 1fr 180px; gap:10px;}
  .decision-view{margin-top:13px; background:var(--panel); border-left:3px solid var(--gold); border-radius:0 10px 10px 0; padding:10px 14px; font-size:14px;}
  .decision-view .lbl{font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--gold-text); font-weight:700;}
  .decision-view .own{color:var(--ink-2); font-size:12.5px; margin-top:4px;}
  .addq{background:var(--card); border:1px dashed var(--lavender); border-radius:var(--radius); padding:16px 20px; margin-top:6px;}
  .addq h3{font-size:14px; color:var(--lavender); margin-bottom:9px;}
  .addq .grid{display:grid; gap:9px;}

  /* ---------- Decisions / tables ---------- */
  table.log{width:100%; border-collapse:collapse; background:var(--card); border-radius:var(--radius); overflow:hidden;}
  .log th{background:var(--plum); text-align:left; font-size:11.5px; letter-spacing:1.2px; text-transform:uppercase; padding:10px 13px; color:var(--cream);}
  .log td{padding:11px 13px; border-top:1px solid var(--line); font-size:13.5px; vertical-align:top;}
  .log td.q{max-width:320px;}

  /* ---------- Updates ---------- */
  .compose{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px 17px; margin-bottom:18px; display:grid; gap:10px;}
  .post{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px 18px; margin-bottom:12px;}
  .post.pinned{border-color:var(--gold);}
  .post .ph{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--cream-dim); margin-bottom:7px; flex-wrap:wrap;}
  .post .ph b{color:var(--gold-soft);}
  .post .body{white-space:pre-wrap; font-size:14px;}

  /* ---------- Documents ---------- */
  .doc-row{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:13px 16px; margin-bottom:9px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .doc-row .t{flex:1; min-width:230px;}
  .doc-row .t b{font-size:14.5px;}
  .doc-row .st{display:block; font-size:12.5px; color:var(--cream-dim); margin-top:2px;}
  .ack{font-size:12px; color:var(--cream-dim);}
  .ack .yes{color:var(--ok); font-weight:700;}
  .doc-add{background:var(--card); border:1px dashed var(--lavender); border-radius:var(--radius); padding:14px 16px; margin-top:12px; display:grid; grid-template-columns:2fr 1fr 2fr auto; gap:9px;}

  /* ---------- Ask ---------- */
  .ask-box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; display:grid; gap:11px; margin-bottom:16px;}
  .ask-ans{background:var(--card-deep); border-left:3px solid var(--gold); border-radius:0 12px 12px 0; padding:15px 18px; white-space:pre-wrap; font-size:14px;}
  .ask-note{background:var(--plum); border-radius:12px; padding:15px 18px; font-size:13.5px;}
  .ask-note b{color:var(--gold-soft);}

  /* ---------- Podcast ---------- */
  .ep-row{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:10px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; transition:border-color 0.2s;}
  .ep-row:hover{border-color:var(--gold-soft);}
  .ep-row.ep-active{border-color:var(--gold); background:rgba(212,168,85,0.06);}
  .ep-row .t{flex:1; min-width:200px;}
  .ep-row .t b{font-size:14.5px; line-height:1.4;}
  .ep-row .st{display:block; font-size:12.5px; color:var(--cream-dim); margin-top:3px;}
  .ep-play-btn{width:44px; height:44px; border-radius:50%; border:2px solid var(--gold); background:transparent; color:var(--gold); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:18px; transition:all 0.2s; flex-shrink:0;}
  .ep-play-btn:hover{background:var(--gold); color:var(--bg);}
  .ep-play-btn.playing{background:var(--gold); color:var(--bg); animation:ep-pulse 2s ease-in-out infinite;}
  @keyframes ep-pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,168,85,0.3);}50%{box-shadow:0 0 0 8px rgba(212,168,85,0);}}
  .ep-badges{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .ep-badge{font-size:10px; padding:3px 8px; border-radius:6px; background:var(--bg); color:var(--cream-dim); border:1px solid var(--line); text-transform:uppercase; letter-spacing:.5px;}
  .ep-add{background:var(--card); border:1px dashed var(--lavender); border-radius:var(--radius); padding:14px 16px; margin-top:12px; display:grid; grid-template-columns:2fr 2fr auto; gap:9px;}

  /* ── Player dock (premium) ── */
  #player-dock{display:none; position:fixed; left:18px; bottom:18px; z-index:70; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:16px; padding:0; box-shadow:var(--shadow-card); max-width:440px; min-width:340px; overflow:hidden; backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);}
  .pl-header{display:flex; align-items:center; gap:10px; padding:12px 16px 0;}
  .pl-header .pl-ic{font-size:16px;}
  .pl-header .pl-t{font-size:13px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pl-header .pl-close{background:none; border:none; color:var(--cream-dim); cursor:pointer; font-size:14px; padding:4px; opacity:0.6; transition:opacity 0.2s;}
  .pl-header .pl-close:hover{opacity:1;}
  .pl-progress{padding:6px 16px; cursor:pointer;}
  .pl-bar-bg{height:4px; background:rgba(255,255,255,0.1); border-radius:2px; position:relative; overflow:visible;}
  .pl-bar-fill{height:100%; background:linear-gradient(90deg, var(--gold-soft), var(--gold)); border-radius:2px; transition:width 0.3s linear; position:relative;}
  .pl-bar-fill::after{content:''; position:absolute; right:-5px; top:-3px; width:10px; height:10px; border-radius:50%; background:var(--gold); opacity:0; transition:opacity 0.2s;}
  .pl-progress:hover .pl-bar-fill::after{opacity:1;}
  .pl-times{display:flex; justify-content:space-between; padding:0 16px; font-size:10px; color:var(--cream-dim); letter-spacing:.3px;}
  .pl-controls{display:flex; align-items:center; justify-content:center; gap:6px; padding:8px 16px 10px;}
  .pl-ctrl{background:none; border:none; color:var(--cream); cursor:pointer; font-size:14px; padding:6px 8px; border-radius:8px; opacity:0.7; transition:all 0.2s; min-width:36px; text-align:center;}
  .pl-ctrl:hover{opacity:1; background:rgba(255,255,255,0.06);}
  .pl-ctrl.active{color:var(--gold); opacity:1;}
  .pl-ctrl.pl-main{font-size:20px; opacity:1; background:var(--gold); color:var(--bg); border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; padding:0;}
  .pl-ctrl.pl-main:hover{transform:scale(1.05);}
  .pl-speed{font-size:11px; font-weight:700; font-family:var(--mono, monospace);}

  .empty{border:1px dashed var(--line); border-radius:var(--radius); padding:34px; text-align:center; color:var(--cream-dim);}
  .toast{position:fixed; bottom:22px; right:22px; background:var(--locked-bg); color:var(--locked-text); font-weight:600; padding:11px 17px; border-radius:10px; box-shadow:var(--shadow-card); z-index:80; font-size:13.5px;}

  /* ---------- Auth & modal ---------- */
  .center-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px; position:relative;}
  .center-wrap::before{content:''; position:absolute; top:30%; left:50%; transform:translate(-50%,-50%); width:500px; height:500px; background:radial-gradient(circle, rgba(212,168,85,0.08) 0%, transparent 70%); pointer-events:none; animation:glow-pulse 4s ease-in-out infinite;}
  @keyframes glow-pulse{0%,100%{opacity:0.5; transform:translate(-50%,-50%) scale(1);}50%{opacity:1; transform:translate(-50%,-50%) scale(1.1);}}
  .authcard{background:linear-gradient(145deg, var(--card) 0%, var(--card-deep) 100%); border:1px solid rgba(212,168,85,0.2); border-radius:20px; padding:44px 46px; max-width:430px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.4), 0 0 80px rgba(212,168,85,0.05); animation:card-float 0.6s ease-out;}
  @keyframes card-float{from{opacity:0; transform:translateY(20px);}to{opacity:1; transform:translateY(0);}}
  .authcard .mark{font-family:'Fraunces', Georgia, serif; font-size:42px; letter-spacing:6px; font-weight:700; background:linear-gradient(135deg, var(--gold-soft) 0%, var(--gold) 50%, var(--gold-soft) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;}
  .authcard .rule{width:52px; height:3px; background:linear-gradient(90deg, transparent, var(--gold), transparent); margin:14px auto;}
  .authcard p{color:var(--cream-dim); font-size:13.5px; margin-bottom:18px; line-height:1.6;}
  .authcard .grid{display:grid; gap:11px; text-align:left;}
  .msg{font-size:13px; color:var(--gold-soft); margin-top:12px; min-height:18px;}
  .overlay{position:fixed; inset:0; background:rgba(23,21,15,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);}
  .modal{background:var(--bg); border:1px solid var(--glass-border); border-radius:16px; padding:25px 27px; width:100%; max-width:500px; box-shadow:var(--shadow-card);}
  .modal h2{font-size:19px; margin-bottom:13px;}
  .modal .grid{display:grid; gap:11px;}
  .modal label{font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--gold-soft); font-weight:700;}
  .modal .foot{display:flex; justify-content:flex-end; gap:10px; margin-top:15px; flex-wrap:wrap;}
  .tpl-desc{font-size:12.5px; color:var(--cream-dim);}

  @media (max-width: 940px){
    .app{grid-template-columns:1fr;}
    .side{border-right:none; border-bottom:1px solid var(--line); padding:env(safe-area-inset-top, 0) 20px 14px;}
    .nav{flex-direction:row; flex-wrap:wrap; gap:4px;}
    .nav button{font-size:13px; padding:8px 12px; min-height:44px;}
    .answers,.v-grid{grid-template-columns:1fr;}
    .resolve .row,.addbar,.doc-add{grid-template-columns:1fr;}
    .main{padding:18px 15px calc(70px + env(safe-area-inset-bottom, 0));}
    .qhead h3,.qctx{max-width:100%;}
    .brand{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
    .brand .mark{font-size:22px;}
    .brand .rule{display:none;}
    .brand .sub,.brand .co{font-size:11px;}
    .whoami{font-size:12px; padding:8px 0;}
  }
  @media (max-width: 600px){
    .side{padding:env(safe-area-inset-top, 12px) 12px 10px;}
    .nav button{font-size:12px; padding:6px 10px;}
    .nav .cnt{font-size:10px; padding:1px 5px;}
    .main{padding:14px 12px calc(70px + env(safe-area-inset-bottom, 0));}
    .pagehead h1{font-size:22px;}
    .authcard{padding:28px 20px;}
    .v-quote{font-size:17px; padding:18px 20px;}
    .v-grid{grid-template-columns:1fr;}
    .v-card{padding:16px;}
    .ob-panels{grid-template-columns:1fr;}
    .onboarding-wrap{padding:20px 12px;}
    .onboarding-header h1{font-size:22px;}
    .art-grid{grid-template-columns:1fr;}
    .ep-add{grid-template-columns:1fr;}
    .doc-add{grid-template-columns:1fr;}
    .addbar{grid-template-columns:1fr;}
    .modal{padding:20px 16px; margin:12px;}
    #player-dock{left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom, 0)); max-width:none;}
    .btn, .btn-gold, .btn-ghost{min-height:44px; font-size:14px;}
    input, textarea, select{font-size:16px !important; min-height:44px;}
    .btn-mic{width:40px; height:40px; font-size:20px;}
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }
  /* ── Artifacts panel ─────────────────────────────── */
  .art-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-top:14px;}
  .art-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; cursor:pointer; transition:border-color .2s;}
  .art-card:hover{border-color:var(--gold-soft);}
  .art-card h3{font-size:15px; margin-bottom:6px;}
  .art-card .art-meta{font-size:12px; color:var(--cream-dim); display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .art-kind{background:var(--plum); border-radius:6px; padding:2px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.5px;}
  .art-status{border-radius:6px; padding:2px 8px; font-size:11px; font-weight:600;}
  .art-status.draft{background:rgba(184,134,58,.1); color:var(--gold-text);}
  .art-status.published{background:rgba(74,140,63,.1); color:var(--ok);}
  .art-status.under_audit{background:rgba(139,92,246,.08); color:#7c3aed;}
  .art-status.verdict_given{background:rgba(74,118,168,.1); color:var(--blue);}
  .art-status.closed{background:var(--panel-2); color:var(--ink-3);}
  .art-status.locked{background:var(--locked-bg); color:var(--locked-text); font-weight:700;}
  .art-status.awaiting_approval{background:rgba(184,134,58,.1); color:var(--gold-text);}
  .art-kind.concept{background:var(--gold); color:var(--ink); font-weight:700;}
  .concept-link{background:var(--panel); border:1px solid var(--glass-border); border-radius:10px; padding:13px 16px; margin:16px 0; cursor:pointer; transition:border-color .2s;}
  .concept-link:hover{border-color:var(--gold); background:var(--bg);}
  .concept-link .cl-label{font-size:12px; color:var(--gold-text); letter-spacing:.6px; text-transform:uppercase; margin-bottom:4px;}
  .concept-link .cl-title{font-size:16px; font-family:'Fraunces',Georgia,serif;}
  .locked-banner{background:var(--locked-bg); border:1px solid var(--gold-soft); border-radius:10px; padding:12px 16px; margin:10px 0; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--locked-text);}
  .locked-banner .lock-icon{font-size:18px;}
  .verdict-badge{display:inline-block; border-radius:6px; padding:3px 10px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
  .verdict-badge.proceed{background:rgba(74,140,63,.1); color:var(--ok); border:1px solid var(--ok);}
  .verdict-badge.hold{background:rgba(184,134,58,.1); color:var(--gold-text); border:1px solid var(--gold);}
  .verdict-badge.redirect{background:rgba(201,116,58,.1); color:var(--warn); border:1px solid var(--warn);}
  .verdict-badge.kill{background:rgba(239,68,68,.08); color:#dc2626; border:1px solid #dc2626;}
  .art-detail{background:var(--bg); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-top:14px; box-shadow:var(--shadow-sm);}
  .art-detail .md-body{font-size:14px; line-height:1.7; color:var(--ink);}
  .md-body h1,.md-body h2,.md-body h3{margin:18px 0 8px; color:var(--gold-text);}
  .md-body h1{font-size:22px; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .md-body h2{font-size:18px;}
  .md-body h3{font-size:15px;}
  .md-body p{margin:8px 0;}
  .md-body ul,.md-body ol{margin:8px 0 8px 24px;}
  .md-body li{margin:4px 0;}
  .md-body code{background:var(--panel-2); padding:2px 6px; border-radius:4px; font-size:13px; font-family:'JetBrains Mono', 'Consolas', monospace;}
  .md-body pre{background:var(--panel-2); padding:14px; border-radius:8px; overflow-x:auto; margin:12px 0;}
  .md-body pre code{background:none; padding:0;}
  .md-body blockquote{border-left:3px solid var(--gold); padding:8px 16px; margin:12px 0; background:rgba(184,134,58,.05); border-radius:0 8px 8px 0;}
  .md-body table{width:100%; border-collapse:collapse; margin:12px 0;}
  .md-body th,.md-body td{border:1px solid var(--line); padding:8px 12px; text-align:left;}
  .md-body th{background:var(--panel-2); font-size:13px; color:var(--gold-text);}
  .finding-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:10px;}
  .finding-card .f-header{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
  .f-sev{border-radius:5px; padding:2px 7px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
  .f-sev.blocker{background:rgba(239,68,68,.1); color:#dc2626;}
  .f-sev.major{background:rgba(184,134,58,.1); color:var(--gold-text);}
  .f-sev.minor{background:rgba(74,118,168,.1); color:var(--blue);}
  .f-sev.question{background:rgba(139,92,246,.08); color:#7c3aed;}
  .f-status{font-size:11px; color:var(--cream-dim);}
  .art-editor textarea{min-height:200px; font-family:'JetBrains Mono', 'Consolas', monospace; font-size:13px; line-height:1.6;}
  .art-toolbar{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center;}

  /* ── Onboarding Wizard ─────────────────────────────────────────── */
  .onboarding-wrap{max-width:800px; margin:0 auto; padding:40px 20px;}
  .onboarding-header{text-align:center; margin-bottom:32px;}
  .onboarding-header .mark{font-size:28px;}
  .onboarding-header h1{margin:12px 0 6px;}
  .onboarding-header .meta{color:var(--cream-dim); font-size:13px; max-width:520px; margin:0 auto 16px;}
  .ob-progress{margin:16px 0 20px;}
  .ob-count{font-size:14px; font-weight:600; color:var(--gold-soft);}
  .ob-bar{height:8px; background:var(--card); border-radius:4px; margin-top:6px; overflow:hidden; position:relative;}
  .ob-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-soft), #e8c97a); border-radius:4px; transition:width 0.4s ease; position:relative;}
  .ob-fill::after{content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%); animation:shimmer 2s ease-in-out infinite;}
  @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  .ob-item{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; transition:all 0.3s ease; animation:ob-fadein 0.4s ease backwards; position:relative; box-shadow:var(--shadow-sm);}
  .ob-item::before{content:''; position:absolute; top:0; left:0; right:0; height:2px; border-radius:12px 12px 0 0; background:linear-gradient(90deg, var(--gold), transparent); opacity:0.5;}
  .ob-item:hover{border-color:var(--gold-soft); transform:translateY(-1px); box-shadow:var(--shadow-card);}
  @keyframes ob-fadein{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:translateY(0);}}
  .ob-item:nth-child(1){animation-delay:0s;}.ob-item:nth-child(2){animation-delay:0.05s;}.ob-item:nth-child(3){animation-delay:0.1s;}.ob-item:nth-child(4){animation-delay:0.15s;}.ob-item:nth-child(5){animation-delay:0.2s;}.ob-item:nth-child(6){animation-delay:0.25s;}.ob-item:nth-child(7){animation-delay:0.3s;}.ob-item:nth-child(8){animation-delay:0.35s;}
  .ob-item.ob-aligned{border-color:var(--ok); background:linear-gradient(135deg, var(--bg) 0%, rgba(74,140,63,0.04) 100%);}
  .ob-item.ob-aligned::before{background:linear-gradient(90deg, var(--ok), transparent);}
  .ob-item.ob-contested{border-color:#f59e0b; background:linear-gradient(135deg, var(--bg) 0%, rgba(245,158,11,0.04) 100%);}
  .ob-item.ob-contested::before{background:linear-gradient(90deg, #f59e0b, transparent);}
  .chip.contested{background:rgba(245,158,11,0.1); color:#d97706; border:1px solid rgba(245,158,11,0.3);}
  .ob-item-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  .ob-num{width:30px; height:30px; border-radius:50%; background:var(--gold); color:var(--bg); font-weight:700; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; box-shadow:0 2px 8px rgba(184,134,58,0.2);}
  .ob-item-head h2{margin:0; font-size:16px; flex:1;}
  .ob-cat{font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--cream-dim); background:var(--card-deep, var(--bg)); padding:2px 8px; border-radius:4px;}
  .ob-body{margin-bottom:16px; padding:12px; background:var(--bg); border-radius:6px; border:1px solid var(--border); font-size:14px; line-height:1.6;}
  .ob-panels{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:600px){.ob-panels{grid-template-columns:1fr;}}
  .ob-panel{background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:14px;}
  .ob-panel h3{margin:0 0 8px; font-size:13px; color:var(--cream-dim); text-transform:uppercase; letter-spacing:0.4px;}
  .ob-disp{font-size:13px; font-weight:600; margin-bottom:8px;}
  .ob-disp.approve{color:#4ade80;}
  .ob-disp.annotate{color:#f59e0b;}
  .ob-disp.pending{color:var(--cream-dim); font-style:italic; font-weight:400;}
  .ob-note{font-size:13px; color:var(--muted); background:var(--card); padding:8px; border-radius:6px; margin-bottom:8px; white-space:pre-wrap;}
  .ob-actions{display:flex; gap:6px; margin-top:8px;}
  .ob-annotate-form{margin-top:10px;}
  .ob-annotate-form textarea{width:100%; min-height:60px; margin-bottom:6px;}

  /* ---------- Voice / Whisper ---------- */
  .voice-wrap{position:relative;}
  .voice-wrap textarea{padding-right:48px;}
  .btn-mic{position:absolute; right:6px; top:6px; width:36px; height:36px; border-radius:50%; border:2px solid var(--gold-soft); background:var(--card-deep, var(--bg)); color:var(--cream); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:18px; transition:all 0.2s; z-index:2;}
  .btn-mic:hover{background:var(--gold-soft); color:var(--bg);}
  .btn-mic.recording{border-color:#ef4444; background:rgba(239,68,68,0.15); animation:mic-pulse 1s ease-in-out infinite;}
  .btn-mic.transcribing{border-color:var(--gold); opacity:0.6; cursor:wait;}
  @keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4);}50%{box-shadow:0 0 0 10px rgba(239,68,68,0);}}
  .voice-lang{position:absolute; right:46px; top:10px; font-size:10px; color:var(--cream-dim); text-transform:uppercase; letter-spacing:0.5px;}

  /* ---------- Voice Review Panel ---------- */
  .voice-review-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:90; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); animation:vr-fadein 0.2s ease;}
  @keyframes vr-fadein{from{opacity:0;}to{opacity:1;}}
  .voice-review{background:var(--card); border:1px solid var(--gold); border-radius:16px; padding:24px; max-width:540px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.5); animation:vr-slidein 0.25s ease;}
  @keyframes vr-slidein{from{transform:translateY(20px); opacity:0;}to{transform:translateY(0); opacity:1;}}
  .voice-review h3{font-size:16px; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
  .vr-label{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--cream-dim); margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .vr-text{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.6; margin-bottom:14px; max-height:180px; overflow-y:auto; white-space:pre-wrap; word-wrap:break-word;}
  .vr-text.improved{border-color:var(--gold-soft); background:rgba(212,168,85,0.04);}
  .vr-text textarea{width:100%; min-height:80px; background:transparent; border:none; color:inherit; font:inherit; resize:vertical; outline:none;}
  .vr-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .vr-actions .btn{min-height:40px;}
  .vr-diff{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--cream-dim); margin-bottom:12px;}
  .vr-diff .saved{color:#10b981; font-weight:600;}
  .vr-spinner{display:inline-block; width:14px; height:14px; border:2px solid var(--cream-dim); border-top-color:var(--gold); border-radius:50%; animation:vr-spin 0.6s linear infinite; vertical-align:middle;}
  @keyframes vr-spin{to{transform:rotate(360deg);}}

  /* ---------- Side Music Pill ---------- */
  #music-pill{position:fixed; left:0; top:50%; transform:translateY(-50%); z-index:71; background:var(--plum); border:1px solid rgba(44,36,24,.12); border-left:none; border-radius:0 12px 12px 0; padding:10px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; transition:all 0.25s; box-shadow:2px 4px 16px rgba(0,0,0,.08);}
  #music-pill:hover{background:var(--card); border-color:var(--gold-soft); padding-right:12px;}
  #music-pill .pill-icon{font-size:16px; line-height:1;}
  #music-pill .pill-label{font-size:9px; writing-mode:vertical-rl; text-orientation:mixed; color:var(--cream-dim); letter-spacing:.5px; text-transform:uppercase;}
  #music-pill.playing{border-color:var(--gold); animation:pill-glow 2s ease-in-out infinite;}
  @keyframes pill-glow{0%,100%{box-shadow:2px 4px 16px rgba(0,0,0,.08);}50%{box-shadow:2px 4px 20px rgba(184,134,58,0.25);}}
  #music-pill.dock-open{opacity:0.3;}

  /* ---------- Side Library Pill ---------- */
  #library-pill{position:fixed; right:0; top:50%; transform:translateY(-50%); z-index:71; background:var(--plum); border:1px solid rgba(44,36,24,.12); border-right:none; border-radius:12px 0 0 12px; padding:10px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; transition:all 0.25s; box-shadow:-2px 4px 16px rgba(0,0,0,.08);}
  #library-pill:hover{background:var(--card); border-color:var(--gold-soft); padding-left:12px;}
  #library-pill .pill-icon{font-size:16px; line-height:1;}
  #library-pill .pill-label{font-size:9px; writing-mode:vertical-rl; text-orientation:mixed; color:var(--cream-dim); letter-spacing:.5px; text-transform:uppercase;}
  #library-pill .pill-count{font-size:10px; background:var(--gold); color:var(--night); border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-weight:700;}
  #library-pill.drawer-open{display:none;}

  /* ---------- Library Drawer ---------- */
  #library-drawer{position:fixed; right:-420px; top:0; bottom:0; width:400px; max-width:90vw; background:linear-gradient(180deg, #FFFFFF 0%, #F5F1EB 100%); border-left:1px solid rgba(44,36,24,.12); z-index:72; transition:right 0.35s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; box-shadow:-8px 0 40px rgba(0,0,0,0.08);}
  #library-drawer.open{right:0;}

  /* Hide pills on login gate */
  body.gate-active #music-pill,
  body.gate-active #library-pill,
  body.gate-active #library-drawer{display:none !important;}
  .lib-header{padding:20px 20px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px;}
  .lib-header h2{margin:0; font-size:20px; flex:1;}
  .lib-close{background:none; color:var(--cream-dim); font-size:22px; padding:4px 8px; border-radius:8px; transition:all 0.2s;}
  .lib-close:hover{color:var(--cream); background:rgba(255,255,255,0.08);}
  .lib-upload-zone{margin:16px; padding:24px 16px; border:2px dashed var(--line); border-radius:14px; text-align:center; cursor:pointer; transition:all 0.3s; position:relative;}
  .lib-upload-zone:hover,.lib-upload-zone.dragover{border-color:var(--gold); background:rgba(212,168,85,0.04);}
  .lib-upload-zone .uz-icon{font-size:28px; margin-bottom:6px;}
  .lib-upload-zone .uz-text{font-size:13px; color:var(--cream-dim);}
  .lib-upload-zone .uz-text b{color:var(--gold-soft);}
  .lib-upload-zone input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .lib-list{flex:1; overflow-y:auto; padding:0 16px 16px;}
  .lib-card{background:#FFFFFF; border:1px solid rgba(44,36,24,.08); border-radius:12px; padding:16px; margin-bottom:12px; transition:all 0.3s; animation:ob-fadein 0.3s ease backwards;}
  .lib-card:hover{border-color:rgba(184,134,58,0.3); transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,0,0,0.06);}
  .lib-card h3{font-family:'Fraunces', Georgia, serif; font-size:15px; margin:0 0 6px; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lib-card .lib-summary{font-size:13px; color:var(--cream-dim); line-height:1.5; margin-bottom:10px; max-height:120px; overflow-y:auto;}
  .lib-card .lib-meta{font-size:11px; color:var(--lavender); display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; overflow:hidden;}
  .lib-card .lib-meta span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px;}
  .lib-card .lib-actions{display:flex; gap:8px;}
  .lib-card .lib-actions button{font-size:12px; padding:5px 10px;}
  .lib-shimmer{background:linear-gradient(90deg, var(--night) 25%, var(--card) 50%, var(--night) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px; height:80px; margin-bottom:12px;}
  .lib-empty{text-align:center; padding:40px 20px; color:var(--cream-dim);}
  .lib-empty .emp-icon{font-size:48px; margin-bottom:12px; opacity:0.5;}
</style>
</head>
<body>
<div id="app"></div>
<div id="music-pill" title="Music controller"><span class="pill-icon">🎧</span><span class="pill-label">Music</span></div>
<div id="library-pill" title="Document Library"><span class="pill-icon">📚</span><span class="pill-label">Library</span></div>
<div id="library-drawer">
  <div class="lib-header"><h2>📚 Library</h2><button class="lib-close" id="lib-close">✕</button></div>
  <div class="lib-upload-zone" id="lib-drop-zone">
    <div class="uz-icon">📄</div>
    <div class="uz-text">Drop a <b>PDF</b> here or <b>tap to browse</b></div>
    <input type="file" accept=".pdf,application/pdf" id="lib-file-input" />
  </div>
  <div class="lib-list" id="lib-list"></div>
</div>
<div id="player-dock"></div>
<audio id="bg-audio" preload="none"></audio>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   XHB × MomenCrafts — Founders' HQ
   ═══════════════════════════════════════════════════════════════════════════

   SCHEMA BOUNDARY
   ───────────────
   public.*   — MomenCrafts investor portal (investor_tokens, investor_sessions,
                investor_events, access_requests, co_*, etc.).
                RLS: service-role only (edge functions).

   xhb.*     — XHB Founders' HQ (allowed_users, sessions, questions, answers,
                plan_items, updates, documents, nudges, episodes, content,
                question_templates, gate_attempts, gate_log, artifacts,
                artifact_versions, findings, enrolment_tokens, api_keys,
                access_log, decision_revisions).
                Read/write: xhb.is_allowed() — two-person allowlist only.

   AUTH MODEL
   ──────────
   XHB auth = Supabase phone OTP (via xhb-gate-request edge function)
            + xhb.is_allowed() row-level security.
   Never MomenCrafts investor_tokens, access_requests, MCR- tokens, or any
   portal tier. The two systems share a Supabase project but are isolated
   by schema. No portal edge function queries any xhb.* table.

   DASHBOARD ACCESS
   ────────────────
   momen@momencrafts.com — founder, superadmin (access management only;
     never bypasses the seal, never verdicts own artifacts).

   SETUP (live mode)
   ─────────────────
     1. Run the xhb schema migrations in your Supabase SQL editor.
     2. Fill SUPABASE_URL and SUPABASE_ANON_KEY below.

  }).eq("id", currentArtifact.id);
  await loadArtifactDetail(currentArtifact.id); await loadArtifacts(); render();
  toast("Artifact unlocked \u2014 now under audit");
}

/* ---- Safe markdown renderer ---- */
function renderMd(md) {
  try {
    const raw = (typeof marked !== "undefined" && marked.parse) ? marked.parse(md || "") : esc(md || "").replace(/\n/g, "<br>");
    return (typeof DOMPurify !== "undefined") ? DOMPurify.sanitize(raw) : raw;
  } catch (e) { return esc(md || ""); }
}

/* ------------------------------ Render ------------------------------------ */
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";

function chipQ(q) {
  if (q.status === "sealed") return '<span class="chip sealed">Sealed</span>';
  if (q.status === "revealed") return '<span class="chip revealed">Revealed</span>';
  const map = { aligned: ["aligned", "Aligned"], divergent: ["divergent", "Divergent \u2014 parked"], decided: ["decided", "Decided"] };
  const m = map[q.outcome] || ["decided", "Resolved"];
  return '<span class="chip ' + m[0] + '">' + m[1] + '</span>';
}

    '<button class="ep-play-btn' + (!isMuted ? ' playing' : '') + '" data-act="ob-music-toggle" style="width:34px; height:34px; font-size:14px;">' +
    (isMuted ? '🔇' : '🔊') + '</button>' +
    '<div style="flex:1; font-size:13px; color:var(--cream-dim);">🎧 Background music · loops while you align</div>' +
    '</div>';

  // ── Check if viewing a past (read-only) round ──
  const isPastRound = currentRound < (publishedRounds.length ? publishedRounds[publishedRounds.length - 1] : 1) && allAligned;

  currentItems.forEach((item, idx) => {
    const disps = alignmentDispositions.filter(d => d.item_id === item.id);
    const myD = disps.find(d => norm(d.email) === norm(me.email));
    const theirD = disps.find(d => norm(d.email) === partner.email);
    const myStatus = myD ? myD.disposition : 'pending';
    const theirStatus = theirD ? theirD.disposition : 'pending';
    // Asymmetric item state
    const itemState = getItemState(item);
    const stateLabels = {
      'awaiting-design': { chip: '⏳ Awaiting design answer', cls: '', who: approverEmail ? nameFor(approverEmail.email) : 'Approver' },
      'awaiting-review': { chip: '👁 Awaiting review', cls: 'ob-contested', who: builderEmail ? nameFor(builderEmail.email) : 'Builder' },
      'contested': { chip: '⚡ Contested', cls: 'ob-contested', who: approverEmail ? nameFor(approverEmail.email) : 'Approver' },
      'settled': { chip: '✔ Settled', cls: 'ob-aligned', who: null }
    };
    const sl = stateLabels[itemState] || stateLabels['awaiting-design'];

    html += '<div class="ob-item ' + sl.cls + '">' +
      '<div class="ob-item-head">' +
      '<span class="ob-num">' + (idx + 1) + '</span>' +
      '<h2 class="serif" dir="auto">' + esc(item.title) + '</h2>' +
      '<span class="ob-cat">' + esc(item.category) + '</span>';

    html += '<span class="chip ' + (itemState === 'settled' ? 'aligned' : itemState === 'contested' ? 'contested' : '') + '">' + sl.chip + '</span>';
    if (sl.who) {
      html += '<span style="font-size:11px; color:var(--cream-dim); margin-left:4px;">Ball: ' + esc(sl.who) + '</span>';
    }
    html += '</div>';

    // Item body (the content to align on)
    if (item.body_md) {
      html += '<div class="ob-body md-body" dir="auto">' + renderMd(item.body_md) + '</div>';
    }

    // Side-by-side panels: You | Partner
    html += '<div class="ob-panels">';

    // My panel
    html += '<div class="ob-panel">' +
      '<h3>You (' + esc(nameFor(me.email)) + ')</h3>';
    if (myStatus === 'approve') {
      html += '<div class="ob-disp approve">✔ Approved</div>';
    } else if (myStatus === 'annotate') {
      html += '<div class="ob-disp annotate">✎ Annotated</div>' +
        '<div class="ob-note" dir="auto">' + esc(myD.note || '') + '</div>';
    } else {
      html += '<div class="ob-disp pending">Pending</div>';
    }

    // Action buttons (always available unless past round)
    if (!isPastRound) {
      // Show role-appropriate actions per asymmetric protocol
      const isApproverUser = me.email && approverEmail && norm(me.email) === norm(approverEmail.email);
      html += '<div class="ob-actions">';
      if (isApproverUser) {
        // Approver: annotate only (design answer)
        html += '<button class="btn btn-gold btn-sm" data-act="ob-annotate-start" data-item="' + item.id + '">✎ Annotate (design answer)</button>' +
          (myStatus === 'annotate' ? '<button class="btn btn-ghost btn-sm" data-act="ob-delete-annotation" data-item="' + item.id + '" style="color:#ef4444;">🗑 Delete</button>' : '');
      } else {
        // Builder: approve or contest — only after approver has annotated
        if (itemState === 'awaiting-design') {
          html += '<div style="font-size:12px; color:var(--cream-dim); padding:6px 0; opacity:0.7;">⏳ Waiting for ' + (approverEmail ? esc(nameFor(approverEmail.email)) : 'approver') + '\'s design answer before you can review.</div>';
        } else {
          html += '<button class="btn btn-gold btn-sm" data-act="ob-approve" data-item="' + item.id + '">✔ Approve (buildable)</button>' +
            '<button class="btn btn-ghost btn-sm" data-act="ob-contest-start" data-item="' + item.id + '" style="border-color:#ef4444; color:#ef4444;">⚡ Contest</button>';
        }
      html +=
        '</div>';
      // Annotation input (hidden by default, shown by JS)
      const draftKey = 'xhb-draft-' + item.id;
      const draftVal = localStorage.getItem(draftKey) || '';
      const prefill = draftVal || (myD && myD.disposition === 'annotate' ? myD.note || '' : '');
      html += '<div class="ob-annotate-form" id="ob-ann-' + item.id + '" style="display:none;">' +
        '<div class="voice-wrap">' +
        '<textarea dir="auto" id="ob-note-' + item.id + '" placeholder="What needs to change? Type or tap 🎤 to speak\u2026" oninput="localStorage.setItem(\'' + draftKey + '\', this.value)">' + esc(prefill) + '</textarea>' +
        '<button class="btn-mic" data-act="voice" data-target="ob-note-' + item.id + '" title="Hold to record voice note">🎤</button>' +
        '</div>' +
        '<button class="btn btn-gold btn-sm" data-act="ob-annotate-submit" data-item="' + item.id + '">Submit annotation</button>' +
        '</div>';
      // Contest reason input (builder only, hidden by default)
      if (!isApproverUser) {
        const contestDraftKey = 'xhb-contest-' + item.id;
        const contestDraftVal = localStorage.getItem(contestDraftKey) || '';
        html += '<div class="ob-contest-form" id="ob-contest-' + item.id + '" style="display:none;">' +
          '<textarea dir="auto" id="ob-contest-reason-' + item.id + '" placeholder="Why can\'t you build this yet? What do you need?" oninput="localStorage.setItem(\'' + contestDraftKey + '\', this.value)">' + esc(contestDraftVal) + '</textarea>' +
          '<button class="btn btn-gold btn-sm" data-act="ob-contest-submit" data-item="' + item.id + '" style="background:#ef4444;">Submit contest</button>' +
          '</div>';
      }
    } else {
      html += '<div style="font-size:11px; color:var(--cream-dim); margin-top:6px;">📋 Read-only — past round</div>';
    }
    html += '</div>';

    // Partner panel
    html += '<div class="ob-panel">' +
      '<h3>' + esc(partner.name) + '</h3>';
    if (theirStatus === 'approve') {
      html += '<div class="ob-disp approve">✔ Approved</div>';
    } else if (theirStatus === 'annotate') {
      html += '<div class="ob-disp annotate">✎ Annotated</div>' +
        '<div class="ob-note" dir="auto">' + esc(theirD.note || '') + '</div>';
    } else {
      html += '<div class="ob-disp pending">Waiting\u2026</div>';
    }
    html += '</div>';

    html += '</div></div>'; // close panels + item
  });

  // ── Add items form (Momen only, for new round) ──
  if (window._showAddItems && iAmBuilder) {
    html += '<div style="background:var(--card); border:2px dashed var(--gold-soft); border-radius:12px; padding:22px 24px; margin-bottom:20px;">' +
      '<h3 style="font-size:15px; margin:0 0 12px;">➕ Add Alignment Items for Round ' + (currentRound + 1) + '</h3>' +
      '<div style="margin-bottom:10px;">' +
      '<input type="text" id="new-item-title" placeholder="Decision title" style="width:100%; margin-bottom:8px; min-height:38px; box-sizing:border-box;" />' +
      '<textarea id="new-item-body" placeholder="Decision body (markdown supported)" style="width:100%; min-height:80px; margin-bottom:8px;"></textarea>' +
      '<input type="text" id="new-item-category" placeholder="Category (e.g. Product, Evidence)" style="width:100%; min-height:38px; box-sizing:border-box;" />' +
      '</div>' +
      '<div style="display:flex; gap:8px;">' +
      '<button class="btn btn-gold btn-sm" data-act="ob-add-item-submit">Add item</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="ob-add-items-close">Done adding</button>' +
      '</div></div>';
  }

  if (!total) {
    html += '<div class="empty">No alignment items found. Run the onboarding seed SQL to populate them.</div>';
  }

  html += '</div>';
  return html;
}

/* ----- Sessions (Q&A) view ----- */
function qCard(q) {
  const meKey = norm(me.email);
  const partner = partnerOf(me.email);
  const mine = q.answers[meKey];
  const theirsKey = Object.keys(q.answers).find(k => k !== meKey);
  const theirs = theirsKey ? q.answers[theirsKey] : null;
  const bothIn = !!mine && !!theirs;
  const sealed = q.status === "sealed";
  let mePanel;
  if (sealed) {
    mePanel = '<div class="apanel"><span class="who">You · ' + esc(me.name) + '</span>' +
      '<div class="voice-wrap">' +
      '<textarea dir="auto" id="ans-' + q.id + '" placeholder="Write your independent answer… or tap 🎤 to speak">' + esc(mine ? mine.body : "") + '</textarea>' +
      '<button class="btn-mic" data-act="voice" data-target="ans-' + q.id + '" title="Hold to record voice note">\uD83C\uDFA4</button>' +
      '</div>' +
      '<div style="display:flex; gap:8px; align-items:center;"><button class="btn btn-gold btn-sm" data-act="save" data-q="' + q.id + '">' + (mine ? "Update sealed answer" : "Seal my answer") + '</button>' +
      (mine ? '<span class="saved-note">Sealed ✓</span>' : "") + '</div></div>';
  } else {
    mePanel = '<div class="apanel"><span class="who">You · ' + esc(me.name) + '</span><div class="body" dir="auto">' + esc(mine ? mine.body : "— no answer recorded —") + '</div></div>';
  }
  let themPanel;
  if (sealed) {
    themPanel = '<div class="apanel"><span class="who partner">' + esc(partner.name) + '</span><div class="locked"><span class="ic">🔒</span><span>' + (theirs ? esc(partner.name) + " has sealed an answer.<br>Reveal to compare." : "Waiting for " + esc(partner.name) + "'s sealed answer…") + '</span></div></div>';
  } else {
    themPanel = '<div class="apanel"><span class="who partner">' + esc(partner.name) + '</span><div class="body" dir="auto">' + esc(theirs ? theirs.body : "— no answer recorded —") + '</div></div>';
  }
  let actions = "";
  if (sealed) {
    if (bothIn) actions = '<button class="btn btn-gold btn-sm" data-act="reveal" data-q="' + q.id + '">Reveal both answers</button><span class="note">Both answers are in.</span>';
    else if (mine && !theirs) actions = confirmReveal[q.id]
      ? '<button class="btn btn-gold btn-sm" data-act="reveal" data-q="' + q.id + '">Confirm reveal with one answer missing</button><span class="note">This breaks the sealed protocol for this question.</span>'
      : '<button class="btn btn-ghost btn-sm" data-act="force" data-q="' + q.id + '">Force reveal…</button><span class="note">Best practice: wait for both sealed answers.</span>';
    else actions = '<span class="note">Answers stay hidden from each other until both are sealed.</span>';
  } else if (q.status === "revealed") actions = '<span class="note">Discuss, then record the outcome below.</span>';
  else actions = '<button class="btn btn-ghost btn-sm" data-act="reopen" data-q="' + q.id + '">Reopen</button>';
  let resolveBlock = "";
  if (q.status === "revealed") {
    resolveBlock = '<div class="resolve"><div class="row">' +
      '<select id="out-' + q.id + '"><option value="decided">Decided</option><option value="aligned">Aligned as-is</option><option value="divergent">Divergent — park it</option></select>' +
      '<input dir="auto" id="dec-' + q.id + '" placeholder="What did we agree? (one or two sentences)" />' +
      '<input dir="auto" id="own-' + q.id + '" placeholder="Owner / follow-up" /></div>' +
      '<div><button class="btn btn-gold btn-sm" data-act="resolve" data-q="' + q.id + '">Log the outcome</button></div></div>';
  }
  if (q.status === "resolved" && (q.decision || q.outcome)) {
    resolveBlock = '<div class="decision-view"><span class="lbl">' + (q.outcome === "divergent" ? "Parked divergence" : "Decision") + '</span><div dir="auto">' + esc(q.decision || "(recorded without text)") + '</div>' + (q.decision_owner ? '<div class="own">Owner: ' + esc(q.decision_owner) + '</div>' : "") + '</div>';
  }
  return '<div class="qcard"><div class="qhead"><div><h3 dir="auto">' + esc(q.prompt) + '</h3>' + (q.context ? '<div class="qctx" dir="auto">' + esc(q.context) + '</div>' : "") + '</div>' + chipQ(q) + '</div>' +
    '<div class="answers">' + mePanel + themPanel + '</div><div class="qactions">' + actions + '</div>' + resolveBlock + '</div>';
}
function viewSessions() {
  const partner = partnerOf(me.email);
  const chips = sessions.map(s => '<button class="sess-chip' + (currentSession && s.id === currentSession.id ? " active" : "") + '" data-act="open" data-s="' + s.id + '" dir="auto">' + esc(s.title) + '</button>').join("") +

    '<div class="sess-chips">' + chips + '</div>' +

}

function viewDecisions() {
  if (!resolvedCache.length) return '<div class="pagehead"><div><h1>Decision register</h1><div class="meta">Every logged outcome, across all sessions \u2014 the record your MOU points to</div></div></div><div class="empty">Nothing logged yet. Reveal a question in a session and record the outcome.</div>';
  let rowsHtml = '';

    if (q.revisions && q.revisions.length) {
      q.revisions.forEach(r => {
        rowsHtml += '<tr style="font-size:12px; color:var(--cream-dim); background:var(--card-deep);">' +
          '<td colspan="2" style="padding-left:24px;">\u21B3 Revised' + (r.reopened_by ? ' by ' + esc(nameFor(r.reopened_by)) : '') + (r.reopened_at ? ' on ' + fmtDate(r.reopened_at) : '') + (r.reason ? ': ' + esc(r.reason) : '') + '</td>' +
          '<td>' + esc(r.prior_outcome || "") + '</td>' +
          '<td dir="auto">' + esc(r.prior_decision || "\u2014") + '</td>' +
          '<td dir="auto">' + esc(r.prior_owner || "\u2014") + '</td></tr>';
      });
    }
  });
  return '<div class="pagehead"><div><h1>Decision register</h1><div class="meta">' + resolvedCache.length + ' logged outcome(s), across all sessions</div></div>' +
    '<button class="btn btn-ghost btn-sm" data-act="export">Export Markdown</button></div>' +
    '<table class="log"><thead><tr><th>Session</th><th>Question</th><th>Outcome</th><th>Decision</th><th>Owner</th></tr></thead><tbody>' + rowsHtml + '</tbody></table>';
}
function exportMarkdown() {
  let md = "# XHB — Decision Register\n\n**Exported:** " + new Date().toISOString().slice(0, 10) + "\n\n";
  resolvedCache.forEach((q, i) => {
    md += "## " + (i + 1) + ". " + q.prompt + "\n\n- **Session:** " + (q.session_title || "—") + "\n- **Outcome:** " + (q.outcome || "resolved") + "\n- **Decision:** " + (q.decision || "—") + "\n- **Owner:** " + (q.decision_owner || "—") + "\n\n";
  });
  const blob = new Blob([md], { type: "text/markdown" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "xhb-decision-register.md"; a.click();
  toast("Register downloaded ✓");
}

/* ----- Artifacts panel ----- */
function viewArtifacts() {

  const KINDS = ["concept","plan","report","walkthrough","decision-brief","reference","note"];
  // Sort: pinned first, then concept, then by updated_at desc
  const sorted = [...artifactsList].sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    if ((a.kind === 'concept') !== (b.kind === 'concept')) return a.kind === 'concept' ? -1 : 1;
    return new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at);
  });
  const cards = sorted.map(a => {
    const verdictHtml = a.verdict ? ' <span class="verdict-badge ' + a.verdict + '">' + a.verdict + '</span>' : '';
    const lockIcon = a.status === 'locked' ? ' \u{1F512}' : '';
    return '<div class="art-card" data-act="art-open" data-id="' + a.id + '">' +
      '<h3 dir="auto">' + esc(a.title) + lockIcon + verdictHtml + '</h3>' +

      '<span class="art-status ' + a.status + '">' + esc(a.status.replace(/_/g, ' ')) + '</span>' +

  return '<div class="pagehead"><div><h1>Artifacts</h1><div class="meta">Structured documents \u2014 publish, audit, verdict</div></div></div>' +

    '<input dir="auto" id="art-title" placeholder="New artifact title\u2026" style="max-width:280px;" />' +

    (cards || '<div class="empty">No artifacts yet. Create one above, or publish from your agent workspace.</div>') +
    '<div class="art-grid">' + cards + '</div>';

function viewArtifactDetail() {
  const a = currentArtifact;
  const latestBody = artifactVersions.length ? artifactVersions[0].body_md : "";
  const verdictHtml = a.verdict ? '<span class="verdict-badge ' + a.verdict + '" style="margin-left:8px;">' + a.verdict.toUpperCase() + '</span>' : '';
  const lockIcon = a.status === 'locked' ? ' \u{1F512}' : '';
  const isConcept = a.kind === 'concept';
  const isAuthor = norm(me.email) === norm(a.created_by);
  const isApprover = meIsApprover();
  const canEdit = isConcept ? isAuthor : true;
  const LOCKABLE_KINDS = ["reference", "concept", "baseline"];
  const isLockable = LOCKABLE_KINDS.includes(a.kind);
  const openBlockers = artifactFindings.filter(f => f.status === "open" && f.severity === "blocker").length;

  // Header
  let html = '<div class="pagehead"><div><h1 dir="auto">' + esc(a.title) + lockIcon + verdictHtml + '</h1>' +
    '<div class="meta"><span class="art-kind' + (isConcept ? ' concept' : '') + '">' + esc(a.kind) + '</span> <span class="art-status ' + a.status + '">' + esc(a.status.replace(/_/g, " ")) + '</span> \u00B7 by ' + esc(nameFor(a.created_by)) + ' \u00B7 ' + fmtDate(a.created_at) + '</div>' +
    '</div><button class="btn btn-ghost btn-sm" data-act="art-back">\u2190 All artifacts</button></div>';

  // Locked banner
  if (a.status === 'locked') {
    html += '<div class="locked-banner"><span class="lock-icon">\u{1F512}</span> This artifact is locked' +
      (a.locked_by ? ' by ' + esc(nameFor(a.locked_by)) + ' on ' + fmtDate(a.locked_at) : '') +
      '. Only the approver may unlock it.</div>';
    if (isApprover) {
      html += '<div class="art-toolbar"><button class="btn btn-ghost btn-sm" data-act="art-unlock">Propose revision (unlock)</button></div>';
    }
  }

  // Approval bar: approver-only, not on own artifacts, not on concepts, not when locked
  if (!isConcept && a.status !== 'locked' && isApprover && !isAuthor &&
      (a.status === "published" || a.status === "under_audit" || a.status === "awaiting_approval")) {
    const openFindings = artifactFindings.filter(f => f.status === "open").length;
    html += '<div class="art-toolbar">' +
      (openFindings > 0 ? '<span style="color:var(--warn);">' + openFindings + ' open finding(s)</span> ' : '<span style="color:var(--ok);">No open findings</span> ') +
      '<button class="btn btn-gold btn-sm" data-act="art-verdict" data-v="proceed">Approve</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="art-verdict" data-v="hold">Request changes</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="art-verdict" data-v="redirect">Redirect</button>' +
      '<button class="btn btn-ghost btn-sm" style="color:#c94a4a;" data-act="art-verdict" data-v="kill">Kill</button></div>';
  }
  if (a.verdict_by) {
    html += '<div style="margin:8px 0; font-size:13px; color:var(--cream-dim);">Verdict by ' + esc(nameFor(a.verdict_by)) + ' on ' + fmtDate(a.verdict_at) + '</div>';
  }

  // Lock button: approver, lockable kind, not locked, zero open blocker findings
  if (isLockable && a.status !== 'locked' && isApprover && openBlockers === 0 &&
      (a.status === "published" || a.status === "verdict_given" || a.status === "under_audit" || a.status === "awaiting_approval")) {
    html += '<div class="art-toolbar"><button class="btn btn-gold btn-sm" data-act="art-lock">\u{1F512} Lock ' + (isConcept ? 'the idea' : 'baseline') + '</button></div>';
  }

  // Editor toggle / body
  if (artEditing) {
    html += '<div class="art-detail art-editor">' +
      '<textarea dir="auto" id="art-editor-body">' + esc(artEditorBody || latestBody) + '</textarea>' +
      '<div style="display:flex; gap:8px; margin-top:8px; align-items:center;">' +
      '<input dir="auto" id="art-change-note" placeholder="Change note (e.g. v2 \u2014 addressed findings)" style="max-width:300px;" />' +
      '<button class="btn btn-gold btn-sm" data-act="art-publish">Publish version</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="art-edit-cancel">Cancel</button></div></div>';
  } else {
    const editBtnHtml = canEdit && a.status !== 'locked'
      ? '<button class="btn btn-gold btn-sm" data-act="art-edit">Edit \u270E</button>'
      : (isConcept && !isAuthor
        ? '<span style="font-size:12px; color:var(--cream-dim); font-style:italic;">Author-only editing \u2014 respond via findings</span>'
        : (a.status === 'locked' ? '' : ''));
    html += '<div class="art-detail">' +
      '<div class="art-toolbar">' + editBtnHtml +
      (artifactVersions.length ? '<span style="font-size:12px; color:var(--cream-dim);">v' + artifactVersions[0].version + ' \u00B7 ' + fmtDate(artifactVersions[0].published_at) + ' by ' + esc(nameFor(artifactVersions[0].published_by)) + '</span>' : '') +
      '</div>' +
      (latestBody ? '<div class="md-body">' + renderMd(latestBody) + '</div>' : '<div class="empty">No content yet' + (canEdit ? ' \u2014 click Edit to write the first version.' : '.') + '</div>') +
      '</div>';
  }

  // ── Findings section with anchor_slug grouping ──
  html += '<div style="margin-top:20px;"><h2 class="serif" style="font-size:16px;">Findings</h2>';
  // Build anchor slugs from rendered markdown headings
  const headingSlugs = [];
  if (latestBody) {
    const headingRx = /^(#{1,6})\s+(.+)$/gm;
    let hm;
    while ((hm = headingRx.exec(latestBody)) !== null) {
      const slug = hm[2].trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      headingSlugs.push({ slug, text: hm[2].trim() });
    }
  }

  // Raise-finding form with optional anchor
  html += '<div style="display:flex; gap:8px; margin:10px 0; align-items:flex-end; flex-wrap:wrap;">' +
    '<textarea dir="auto" id="finding-body" placeholder="Raise a finding\u2026" style="min-height:60px;"></textarea>' +
    '<select id="finding-sev"><option value="question">Question</option><option value="minor">Minor</option><option value="major">Major</option><option value="blocker">Blocker</option></select>';
  if (headingSlugs.length) {
    html += '<select id="finding-anchor"><option value="">Unanchored</option>' +
      headingSlugs.map(h => '<option value="' + esc(h.slug) + '">\u{1F3F3}\uFE0F ' + esc(h.text) + '</option>').join('') + '</select>';
  }
  html += '<button class="btn btn-gold btn-sm" data-act="art-raise-finding">Raise</button></div>';

  // Group findings by anchor_slug
  const anchored = {};
  const unanchored = [];
  artifactFindings.forEach(f => {
    if (f.anchor_slug && headingSlugs.some(h => h.slug === f.anchor_slug)) {
      if (!anchored[f.anchor_slug]) anchored[f.anchor_slug] = [];
      anchored[f.anchor_slug].push(f);
    } else {
      unanchored.push(f);
    }
  });

  function renderFinding(f) {
    let fHtml = '<div class="finding-card"><div class="f-header">' +
      '<span class="f-sev ' + f.severity + '">' + f.severity + '</span>' +
      '<span class="f-status">' + f.status + '</span>' +
      '<span class="f-status">v' + f.version + ' \u00B7 ' + esc(nameFor(f.raised_by)) + ' \u00B7 ' + fmtDate(f.raised_at) + '</span></div>' +
      '<div dir="auto" style="margin-bottom:8px;">' + esc(f.body) + '</div>';
    if (f.response) {
      fHtml += '<div style="border-left:2px solid var(--gold-soft); padding-left:10px; margin:8px 0; font-size:13px;">' +
        '<b>' + esc(nameFor(f.responded_by)) + ':</b> ' + esc(f.response) + '</div>';
    }
    if (f.status === "open") {
      fHtml += '<div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;">' +
        '<textarea dir="auto" id="resp-' + f.id + '" placeholder="Respond\u2026" style="width:100%; min-height:60px;"></textarea>' +
        '<button class="btn btn-ghost btn-sm" data-act="art-respond" data-fid="' + f.id + '">Reply</button>' +
        '<button class="btn btn-ghost btn-sm" data-act="art-resolve-finding" data-fid="' + f.id + '" data-fs="fixed">Fixed</button>' +
        '<button class="btn btn-ghost btn-sm" data-act="art-resolve-finding" data-fid="' + f.id + '" data-fs="resolved">Resolved</button></div>';
    }
    fHtml += '</div>';
    return fHtml;
  }

  // Render anchored groups
  headingSlugs.forEach(h => {
    if (anchored[h.slug] && anchored[h.slug].length) {
      html += '<div style="margin-top:12px;"><h3 style="font-size:13px; color:var(--gold-soft); margin-bottom:6px;">\u{1F3F3}\uFE0F ' + esc(h.text) + '</h3>';
      anchored[h.slug].forEach(f => { html += renderFinding(f); });
      html += '</div>';
    }
  });
  // Render unanchored
  if (unanchored.length) {
    if (Object.keys(anchored).length) {
      html += '<div style="margin-top:12px;"><h3 style="font-size:13px; color:var(--cream-dim); margin-bottom:6px;">Unanchored</h3>';
    }
    unanchored.forEach(f => { html += renderFinding(f); });
    if (Object.keys(anchored).length) html += '</div>';
  }
  if (!artifactFindings.length) html += '<div class="empty" style="margin-top:8px;">No findings yet.</div>';
  html += '</div>';

  // Version history
  if (artifactVersions.length > 1) {
    html += '<div style="margin-top:20px;"><h2 class="serif" style="font-size:16px;">Version history</h2>';
    artifactVersions.forEach(v => {
      html += '<div style="font-size:13px; color:var(--cream-dim); margin:6px 0;">' +
        '<b>v' + v.version + '</b> · ' + fmtDate(v.published_at) + ' by ' + esc(nameFor(v.published_by)) +
        (v.change_note ? ' — ' + esc(v.change_note) : '') + '</div>';
    });
    html += '</div>';
  }

  return html;
}

const audioEl = document.getElementById("bg-audio");
let _fadeInterval = null;
let _loopEnabled = false;

function fadeAudio(targetVol, durationMs, onDone) {
  clearInterval(_fadeInterval);
  const step = 0.05;
  const intervalMs = durationMs * step / Math.abs(targetVol - audioEl.volume || 0.01);
  _fadeInterval = setInterval(() => {
    if (targetVol > audioEl.volume) {
      audioEl.volume = Math.min(audioEl.volume + step, targetVol);
    } else {
      audioEl.volume = Math.max(audioEl.volume - step, targetVol);
    }
    if (Math.abs(audioEl.volume - targetVol) < step) {
      audioEl.volume = targetVol;
      clearInterval(_fadeInterval);
      if (onDone) onDone();
    }
  }, intervalMs);
}

function playWithFade(url) {
  if (audioEl.src && !audioEl.paused) {
    // Fade out current, then switch
    fadeAudio(0, 800, () => {
      audioEl.src = url;
      audioEl.volume = 0;
      audioEl.loop = _loopEnabled;
      audioEl.play().then(() => fadeAudio(1, 800)).catch(() => toast("Could not play \u2014 check the audio URL."));
    });
  } else {
    audioEl.src = url;
    audioEl.volume = 0;
    audioEl.loop = _loopEnabled;
    audioEl.play().then(() => fadeAudio(1, 800)).catch(() => toast("Could not play \u2014 check the audio URL."));
  }
}

function pauseWithFade() {
  fadeAudio(0, 600, () => audioEl.pause());
}

function fmtTime(s) {
  if (!s || !isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

let _progressTimer = null;
const SPEEDS = [0.75, 1, 1.25, 1.5, 2];
let _speedIdx = 1;

let _dockVisible = false;

function updatePill() {
  const pill = document.getElementById('music-pill');
  if (!pill) return;
  const icon = pill.querySelector('.pill-icon');
  if (!audioEl.paused) {
    pill.classList.add('playing');
    icon.textContent = '\uD83D\uDD0A';
  } else {
    pill.classList.remove('playing');
    icon.textContent = '\uD83C\uDFA7';
  }
  pill.classList.toggle('dock-open', _dockVisible);
}

function renderPlayer() {
  const dock = document.getElementById("player-dock");
  updatePill();
  if (!currentEp || !_dockVisible) { dock.style.display = "none"; dock.innerHTML = ""; clearInterval(_progressTimer); return; }
  dock.style.display = "block";

  const dur = audioEl.duration || 0;
  const cur = audioEl.currentTime || 0;
  const pct = dur > 0 ? (cur / dur * 100) : 0;

  dock.innerHTML =
    '<div class="pl-header">' +
      '<span class="pl-ic">\uD83C\uDFA7</span>' +
      '<div class="pl-t" dir="auto">' + esc(currentEp.title) + '</div>' +
      '<button class="pl-close" data-act="pl-close" title="Close">\u2715</button>' +
    '</div>' +
    '<div class="pl-progress" data-act="pl-seek">' +
      '<div class="pl-bar-bg"><div class="pl-bar-fill" style="width:' + pct.toFixed(1) + '%;"></div></div>' +
    '</div>' +
    '<div class="pl-times"><span>' + fmtTime(cur) + '</span><span>-' + fmtTime(Math.max(0, dur - cur)) + '</span></div>' +
    '<div class="pl-controls">' +
      '<button class="pl-ctrl pl-speed" data-act="pl-speed" title="Playback speed">' + SPEEDS[_speedIdx] + 'x</button>' +
      '<button class="pl-ctrl" data-act="pl-skip" data-dir="-15" title="Back 15s">\u23EA 15</button>' +
      '<button class="pl-ctrl pl-main" data-act="pl-toggle">' + (audioEl.paused ? '\u25B6' : '\u23F8') + '</button>' +
      '<button class="pl-ctrl" data-act="pl-skip" data-dir="15" title="Forward 15s">15 \u23E9</button>' +
      '<button class="pl-ctrl' + (_loopEnabled ? ' active' : '') + '" data-act="pl-loop" title="Loop">\uD83D\uDD01</button>' +
    '</div>';

  // Start progress timer for smooth updates
  clearInterval(_progressTimer);
  if (!audioEl.paused) {
    _progressTimer = setInterval(() => {
      const fill = dock.querySelector('.pl-bar-fill');
      const timeL = dock.querySelector('.pl-times span:first-child');
      const timeR = dock.querySelector('.pl-times span:last-child');
      if (fill && audioEl.duration) {
        fill.style.width = (audioEl.currentTime / audioEl.duration * 100).toFixed(1) + '%';
      }
      if (timeL) timeL.textContent = fmtTime(audioEl.currentTime);
      if (timeR) timeR.textContent = '-' + fmtTime(Math.max(0, (audioEl.duration || 0) - audioEl.currentTime));
    }, 500);
  }
}
audioEl.addEventListener("ended", () => {
  // Auto-advance through all tracks, loop the whole list at the end
  const playable = episodesList.filter(ep => ep.url);
  if (playable.length === 0) { clearInterval(_progressTimer); renderPlayer(); return; }

  const currentIdx = currentEp ? playable.findIndex(ep => ep.id === currentEp.id) : -1;
  const nextIdx = (currentIdx + 1) % playable.length; // wraps to 0 after last track

  currentEp = playable[nextIdx];
  playWithFade(currentEp.url);
  if (nextIdx === 0 && currentIdx > 0) {
    toast('\uD83D\uDD01 Playlist restarted');
  } else {
    toast('\u25B6 Now playing: ' + currentEp.title);
  }
});
["play", "pause"].forEach(ev => audioEl.addEventListener(ev, () => { updatePill(); renderPlayer(); if (nav === "podcast") render(); }));

// Pill click — toggle dock
document.getElementById('music-pill').addEventListener('click', () => {
  if (!currentEp && audioEl.paused) {
    // Start music if nothing playing
    const musicEp = episodesList.find(ep => ep.title.toLowerCase().includes('music') || ep.title.toLowerCase().includes('ambient'));
    if (musicEp && musicEp.url) {
      currentEp = musicEp;
      _loopEnabled = false;
      _dockVisible = true;
      playWithFade(musicEp.url);
    } else {
      toast('No music track available.');
    }
  } else {
    _dockVisible = !_dockVisible;
  }
  renderPlayer();
});

/* ----- Shell ----- */
function unseenNudges() { return nudges.filter(n => !n.seen && norm(n.to_email) === norm(me.email)); }
let _renderFromRealtime = false; // set true when render is triggered by realtime
function render() {
  // ── Invariant 11: never clobber a note being typed ──
  // If a realtime event triggers render while the user is typing in an input,
  // skip the re-render to avoid destroying their work.
  const active = document.activeElement;
  const isTyping = active && (active.tagName === 'TEXTAREA' || (active.tagName === 'INPUT' && active.type !== 'button' && active.type !== 'submit'));
  if (_renderFromRealtime && isTyping && active.value) {
    // Defer: the next user action will trigger a clean render
    return;
  }

  // Save focus state for non-realtime renders (e.g. after a button click that also triggers render)
  let savedFocus = null;
  if (isTyping && active.id) {
    savedFocus = { id: active.id, value: active.value, start: active.selectionStart, end: active.selectionEnd };
  }

  try { _render(); } catch (err) {
    console.error('Render error:', err);
    app.innerHTML = '<div class="center-wrap"><div class="authcard"><h2>Something went wrong</h2><p>' + esc(err.message) + '</p><button class="btn btn-gold" onclick="location.reload()">Reload</button></div></div>';
  }

  // Restore focus after render
  if (savedFocus) {
    const el = document.getElementById(savedFocus.id);
    if (el) {
      el.value = savedFocus.value;
      el.focus();
      try { el.setSelectionRange(savedFocus.start, savedFocus.end); } catch(e) {}
    }
  }
  _renderFromRealtime = false;
}
function _render() {
  if (LIVE && !me) { renderAuth(); return; }
  if (LIVE && dataLoading) {
    app.innerHTML = '<div class="center-wrap"><div class="authcard"><div class="mark">XHB</div><div class="rule"></div><h2 class="serif">Loading workspace\u2026</h2><p style="color:var(--muted);">Fetching your venture data.</p></div></div>';
    return;
  }
  // ── Onboarding gate: while incomplete, route to the wizard ──
  if (LIVE && !onboardingComplete && alignmentItems.length > 0) {
    app.innerHTML = viewOnboarding();
    return;
  }
  const counts = { sessions: sessions.length, decisions: resolvedCache.length, plan: planItems.filter(p => p.status !== "done").length };
  const navBtn = (key, label, cnt) => '<button class="' + (nav === key ? "active" : "") + '" data-act="nav" data-nav="' + key + '" aria-label="' + label + (cnt ? ' (' + cnt + ')' : '') + '" role="tab" aria-selected="' + (nav === key) + '">' + label + (cnt ? '<span class="cnt">' + cnt + '</span>' : "") + '</button>';
  const nb = unseenNudges().map(n =>

    '<button class="btn btn-gold btn-sm" data-act="nudge-open" data-id="' + n.id + '" data-s="' + (n.session_id || "") + '">Open session</button>' +
    '<button class="btn btn-ghost btn-sm" data-act="nudge-seen" data-id="' + n.id + '">Done</button></div>').join("");
  let view = "";
  if (nav === "vision") view = viewVision();
  else if (nav === "plan") view = viewPlan();

  else if (nav === "decisions") view = viewDecisions();

  else if (nav === "podcast") view = viewPodcast();

  app.innerHTML =
  '<div class="app"><aside class="side" role="navigation" aria-label="Main navigation">' +
    '<div class="brand"><div class="mark">XHB</div><div class="rule"></div><div class="sub">Founders\u2019 HQ</div><div class="co">built by <b>MomenCrafts</b></div></div>' +
    '<nav class="nav" role="tablist" aria-label="Workspace sections">' + navBtn("vision", "Vision") + navBtn("plan", "Plan", counts.plan) + navBtn("sessions", "Q&A sessions", counts.sessions) + navBtn("artifacts", "Audit & Artifacts", artifactsList.length) + navBtn("decisions", "Decisions", counts.decisions) + navBtn("updates", "Updates") + navBtn("docs", "Documents") + navBtn("podcast", "Podcast \ud83c\udfa7") + navBtn("ask", "Ask XHB") + '</nav>' +
    '<div class="whoami"><b>' + esc(me.name) + '</b>' + esc(me.email) + '<div style="margin-top:5px;">Partner: ' + esc(partnerOf(me.email).name) + '</div>' +
    (LIVE ? '<div style="margin-top:8px;"><button class="link" data-act="signout" aria-label="Sign out of XHB">Sign out</button></div>' : "") + '</div>' +
  '</aside><main class="main" role="main" aria-label="Workspace content">' +
    (!LIVE ? '<div class="demo-banner" role="status">Demo mode \u2014 sample data, nothing is saved. Run supabase_setup_v2.sql and fill the CONFIG block to go live.</div>' : "") +
    nb + view + '</main></div>';

let toastTimer = null;
function toast(text) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div"); el.className = "toast"; el.textContent = text;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
}
