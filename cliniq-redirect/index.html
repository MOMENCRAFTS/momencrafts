<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="4;url=https://momencrafts.com" />
  <title>cliniq.one — تم الانتقال</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://momencrafts.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', 'Inter', sans-serif;
      background: #FFFFFF;
      color: #1A1A2E;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .logo-mark {
      width: 56px;
      height: 56px;
      background: #00A896;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 4px 20px rgba(0,168,150,0.25);
    }
    .logo-mark svg { width: 32px; height: 32px; fill: white; }

    .brand {
      font-size: 1.8rem;
      font-weight: 700;
      color: #00A896;
      margin-bottom: 2rem;
      letter-spacing: -0.02em;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: #00A896;
      margin: 0 auto 2rem;
      opacity: 0.3;
    }

    .message-en {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: #555;
      margin-bottom: 0.4rem;
      direction: ltr;
      text-align: center;
    }
    .message-ar {
      font-size: 1.05rem;
      color: #333;
      font-weight: 600;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .progress-wrap {
      width: 220px;
      height: 3px;
      background: #E8F8F6;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    .progress-bar {
      height: 100%;
      background: #00A896;
      width: 0%;
      animation: fill 4s linear forwards;
      border-radius: 999px;
    }
    @keyframes fill { to { width: 100%; } }

    .countdown {
      font-family: 'Inter', monospace;
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 2.5rem;
      text-align: center;
      direction: ltr;
    }

    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .btn-primary {
      background: #00A896;
      color: white;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }

    .btn-secondary {
      border: 1px solid #00A896;
      color: #00A896;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: #E8F8F6; }

    .domain-hint {
      font-family: 'Inter', monospace;
      font-size: 0.72rem;
      color: #CCC;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="logo-mark">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
  </div>

  <div class="brand">cliniq.one</div>
  <div class="divider"></div>

  <p class="message-en">We've moved to MomentCraft Studios.</p>
  <p class="message-ar">انتقلنا إلى مومنت كرافت ستوديوز</p>

  <div class="progress-wrap">
    <div class="progress-bar" id="progress"></div>
  </div>
  <div class="countdown">Redirecting in <span id="countdown">4</span>...</div>

  <div class="actions">
    <a href="https://momencrafts.com" class="btn-primary">
      View on MomentCraft Studios →
    </a>
    <a href="https://app.cliniq.one" class="btn-secondary">
      Open App →
    </a>
  </div>

  <div class="domain-hint">momencrafts.com</div>

  <script>
    let count = 4;
    const el = document.getElementById('countdown');
    const timer = setInterval(() => {
      count--;
      el.textContent = count;
      if (count <= 0) {
        clearInterval(timer);
        window.location.replace('https://momencrafts.com');
      }
    }, 1000);
  </script>
</body>
</html>
